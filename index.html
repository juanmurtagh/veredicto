<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Veredicto</title>
<meta name="theme-color" content="#F6F1E7">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<!-- Leaflet: la librería del mapa (libre y gratis, sin registro) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- MapLibre + su conector con Leaflet: dibujan el mapa de OpenFreeMap (gratis, sin llave) -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&display=swap">

<!-- Librería oficial de Supabase: le da a la página las funciones para hablar con la base de datos -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<style>
/* ============ COLORES Y TIPOGRAFÍAS ============
   Crema y rojo vino. Todos los colores están definidos acá una sola vez. */
:root{
  --bg:#F6F1E7; --surface:#FFFBF2; --soft:#EFE6D6; --ink:#2A1F1C; --muted:#75665D; --line:#E7DCC8;
  --accent:#8E1B2A; --accent-ink:#FFFBF2; --off:#DCCDB4; --off-ink:#5A4A40; --danger:#B3261E;
  --display:'Gloock',Georgia,'Times New Roman',serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
}
/* Modo oscuro automático (si el celular está en oscuro y no elegiste "Claro") */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161112; --surface:#201819; --soft:#2C2223; --ink:#F3E9DA; --muted:#A8978A; --line:#352A2A;
  --accent:#D4566A; --accent-ink:#1A0E10; --off:#3E3132; --off-ink:#C9B8A8; --danger:#F08A80;
  color-scheme:dark}}
/* Modo oscuro elegido a mano (mismos colores que arriba) */
:root[data-theme="dark"]{
  --bg:#161112; --surface:#201819; --soft:#2C2223; --ink:#F3E9DA; --muted:#A8978A; --line:#352A2A;
  --accent:#D4566A; --accent-ink:#1A0E10; --off:#3E3132; --off-ink:#C9B8A8; --danger:#F08A80;
  color-scheme:dark}

/* Sin zoom: el celular no agranda la pantalla al tocar un campo ni con doble toque */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
select.orden{font-size:16px!important}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.vacio{text-align:center;color:var(--muted);margin:0;padding:8px 0}
.err{font-size:13px;color:var(--danger);margin:0}

/* ============ BOTONES Y CAMPOS ============ */
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dan{color:var(--danger)}
.btn.chico{height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=url],textarea{
  width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}

/* ============ PANTALLA DE INGRESO Y BIENVENIDA ============ */
.portada{max-width:400px;margin:9vh auto 0;display:flex;flex-direction:column;gap:14px}
.marca{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:8px}
.marca h1{font-size:48px;line-height:1}
.marca p{margin:0;color:var(--muted);max-width:30ch}
.sello{width:88px;height:88px;border-radius:22px}
.pass{position:relative}
.pass input{padding-right:84px}
.ver{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--accent);font-weight:600;font-size:13px}
.cambiar{text-align:center;margin:0;color:var(--muted);font-size:14px}
.separador{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin-top:6px}
.separador::before,.separador::after{content:'';flex:1;height:1px;background:var(--line)}
.btn.grande{width:100%;height:48px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;font-size:16px}
.btn.grande:hover{background:var(--soft)}
.portada .btn.pri{width:100%;height:48px}
.opciones{display:grid;gap:10px}
.opcion{text-align:left;display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.opcion.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opcion b{font-size:15px}
.opcion span{font-size:13px;color:var(--muted)}

/* ============ ENCABEZADO DE LA APP ============ */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px}
header.top h1{font-size:34px;line-height:1}
.ico{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.ico svg{width:20px;height:20px}
.invitar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--soft);border-radius:var(--r);padding:14px 16px}
.invitar p{margin:0;font-size:14px}
.codigo{font-family:var(--display);font-size:24px;letter-spacing:.12em}

/* ============ CATEGORÍAS (pestañas) ============ */
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--muted)}
.cat.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cat.mas{border-style:dashed}

/* ============ RANKING ============ */
.rank-cab{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rank-cab h2{font-size:28px}
.lista{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.item:hover{border-color:var(--muted)}
.pos{font-family:var(--display);font-size:22px;color:var(--muted);text-align:center}
.item.top1 .pos{color:var(--accent)}
.item .nom{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub.choque{color:var(--accent);font-weight:600}
.tarjetas{display:flex;gap:5px}
/* Cada tarjeta es el puntaje de una persona, como los jurados de la tele */
.tarjeta{width:40px;height:50px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  box-shadow:0 1px 0 rgba(0,0,0,.08)}
.tarjeta b{font-family:var(--display);font-weight:400;font-size:19px}
.tarjeta small{font-size:9px;font-weight:700;letter-spacing:.06em;margin-top:4px;opacity:.85}
.tarjeta.falta{background:transparent;color:var(--muted);border:1.5px dashed var(--off)}
.tarjeta.baja{background:var(--off);color:var(--off-ink)}

/* ============ VENTANA DE CARGA ============ */
.velo{position:fixed;inset:0;background:rgba(20,12,12,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.hoja{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
@media (min-width:600px){.velo{align-items:center}.hoja{border-radius:20px}}
.hoja h3{font-size:26px}
.fin{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* Selector de nota: la tarjeta grande con − y + */
.nota{display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 0}
.nota .tarjeta{width:84px;height:104px;border-radius:12px}
.nota .tarjeta b{font-size:44px}
.nota .tarjeta small{font-size:11px}
.paso{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:24px;line-height:1}
.rango{width:100%;accent-color:var(--accent)}
.sinnota{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.otro{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.otro .tarjeta{width:34px;height:42px}
.otro .tarjeta b{font-size:16px}
.confirma{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.confirma span{flex:1;min-width:150px}

/* ============ BOTÓN FIJO, AVISOS Y APARIENCIA ============ */
.pie{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center}
.pie .btn{width:100%;max-width:600px;height:54px;font-size:17px;border-radius:16px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:20;max-width:calc(100% - 32px)}
.tema{display:inline-flex;align-self:center;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.tema button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.tema button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
@media (prefers-reduced-motion:no-preference){.velo .hoja{animation:sube .2s ease-out}@keyframes sube{from{transform:translateY(24px);opacity:.6}}}

/* ============ GRUPOS ============ */
.grupo-btn{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:0;background:none;padding:0;color:var(--muted);font-weight:600;font-size:15px}
.grupo-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grupo-btn svg{width:16px;height:16px;flex:none}
.titulo{display:flex;flex-direction:column;gap:6px;min-width:0}
.grupos{display:flex;flex-direction:column;gap:8px}
.grupo{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.grupo.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.grupo b{font-size:15px}
.grupo span{font-size:13px;color:var(--muted)}
.miembro{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.miembro:last-child{border-bottom:0}
.etiqueta{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:6px}

/* ============ COINCIDENCIA Y POLÉMICOS ============ */
.afinidad{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);padding:14px 16px}
.afinidad b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.afinidad span{font-size:14px;opacity:.9}
.jurados{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.jurado{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px}
.jurado b{font-family:var(--display);font-weight:400;font-size:22px}
.jurado span{font-size:13px;color:var(--muted)}
.volver{align-self:flex-start;background:transparent;border:0;color:var(--accent);font-weight:600;padding:0}

/* ============ VISTAS, PENDIENTES Y ASPECTOS ============ */
.vistas{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.vistas button{flex:1;height:36px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted)}
.vistas button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.promedio{width:50px;height:50px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.promedio b{font-family:var(--display);font-weight:400;font-size:19px}
.promedio.falta{border-style:dashed;border-color:var(--off);color:var(--muted)}
.item .pend{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--off);justify-self:center}
.asp{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.asp:last-child{border-bottom:0}
.asp .ctrl{display:flex;align-items:center;gap:6px}
.asp .val{min-width:40px;text-align:center;font-family:var(--display);font-size:22px}
.paso.chico{width:32px;height:32px;font-size:18px}
/* Estrellas */
.estrellas{display:inline-flex;gap:5px;vertical-align:middle}
.est{position:relative;width:40px;height:40px;display:block}
.est svg{position:absolute;inset:0;width:100%;height:100%}
.est-vacia{fill:var(--soft);stroke:var(--off);stroke-width:1}
.est-llena{position:absolute;inset:0;overflow:hidden;transition:width .12s}
.est-llena svg{width:40px;height:40px}
.est-llena path{fill:var(--accent)}
.estrellas.chicas{gap:2px}
.estrellas.chicas .est,.estrellas.chicas .est-llena svg{width:20px;height:20px}
.nota{gap:12px}
.nota .paso{width:40px;height:40px;font-size:22px}
.asp-otros{font-size:12px;color:var(--muted)}
.sacar-asp{width:28px;height:28px;border-radius:50%;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;margin-left:2px}
.sacar-asp:hover{background:var(--line);color:var(--ink,inherit)}
.asp-voto{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.asp-fuera{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.cat.chica{height:30px;padding:0 12px;font-size:13px}
.editor-asp{display:flex;gap:8px;align-items:center}
.editor-asp input{flex:1;min-width:0}
.quitar{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1;color:var(--muted);flex:none}
.notas-de{display:flex;flex-direction:column;gap:8px}

/* ============ NOTAS OCULTAS Y VEREDICTO DEL GRUPO ============ */
.tarjeta.oculta{background:var(--soft);color:var(--muted);border:1.5px solid var(--off)}
.tarjeta.oculta svg{margin-bottom:2px}
.item .sub.oculto{color:var(--accent)}
.sellado{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink)}
.sellado svg{flex:none;color:var(--accent);width:20px;height:20px}
.grupo-veredicto{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
.gv-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.gv-nota{font-family:var(--display);font-size:44px;line-height:1;color:var(--accent);margin-right:8px}
.gv-de{font-size:13px;color:var(--muted)}
.gv-coinc{text-align:right;display:flex;flex-direction:column}
.gv-coinc b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.gv-coinc span{font-size:13px;color:var(--muted)}

/* ============ BIENVENIDA: las tres tarjetas se abren en abanico ============ */
.splash{position:fixed;inset:0;z-index:100;background:#8E1B2A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .45s ease}
.splash.fuera{opacity:0;pointer-events:none}
.splash .abanico{position:relative;width:170px;height:120px}
.splash .carta{position:absolute;left:50%;bottom:0;width:62px;height:84px;margin-left:-31px;border-radius:9px;background:#FFFBF2;display:grid;place-items:center;
  transform-origin:50% 100%;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:abrir .8s cubic-bezier(.2,.9,.3,1.2) both}
.splash .carta svg{width:30px;height:30px}
.splash .c1{--r:-24deg;--x:-46px;animation-delay:.4s}
.splash .c3{--r:24deg;--x:46px;animation-delay:.4s}
.splash .c2{--r:0deg;--x:0px;z-index:1;animation-delay:.15s;width:70px;height:94px;margin-left:-35px}
@keyframes abrir{from{transform:translateX(0) rotate(0) translateY(30px);opacity:0}to{transform:translateX(var(--x)) rotate(var(--r));opacity:1}}
.splash h1{color:#FFFBF2;font-size:46px;animation:aparecer .6s 1.1s both}
@keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ SELLO AL DICTAR Y REVELACIÓN DE NOTAS ============ */
.escena{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(20,10,12,.55);animation:fundir .2s both}
.escena.fuera{animation:fundirFuera .3s both}
@keyframes fundir{from{opacity:0}}
@keyframes fundirFuera{to{opacity:0}}
.sello-golpe{width:150px;height:150px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:4px dashed var(--accent-ink);outline:6px solid var(--accent);animation:golpe .45s cubic-bezier(.3,1.6,.5,1) both}
.sello-golpe b{font-family:var(--display);font-weight:400;font-size:64px;line-height:1}
.sello-golpe small{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
@keyframes golpe{from{transform:scale(2.4) rotate(-14deg);opacity:0}60%{opacity:1}to{transform:scale(1) rotate(-8deg)}}
.revela{background:var(--surface);border-radius:20px;padding:24px 20px;width:min(92vw,420px);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;animation:golpe2 .3s both}
@keyframes golpe2{from{transform:translateY(16px);opacity:0}}
.revela h3{font-size:24px;margin:0}
.revela .mesa{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.revela .juez{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);max-width:72px}
.revela .juez span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72px}
/* cada tarjeta tiene dos caras: el dorso (con el candado) y el frente (la nota) */
.giro{display:block;width:56px;height:70px;perspective:600px}
.giro .cara{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:dar .55s both;animation-delay:var(--d)}
.giro .lado{position:absolute;inset:0;border-radius:9px;display:flex;align-items:center;justify-content:center}
.giro .dorso{background:var(--soft);border:1.5px solid var(--off);color:var(--muted);animation:tapar .55s both;animation-delay:var(--d)}
.giro .frente{background:var(--accent);color:var(--accent-ink);transform:rotateY(180deg);font-family:var(--display);font-size:28px;animation:destapar .55s both;animation-delay:var(--d)}
/* a mitad del giro, el dorso desaparece y aparece la nota */
@keyframes tapar{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes destapar{0%,49%{opacity:0}50%,100%{opacity:1}}
.giro .frente.baja{background:var(--off);color:var(--off-ink)}
@keyframes dar{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.revela .final{display:flex;flex-direction:column;align-items:center;gap:2px;animation:aparecer .4s both;animation-delay:var(--d)}
.revela .final b{font-family:var(--display);font-weight:400;font-size:52px;line-height:1;color:var(--accent)}
.revela .final span{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.splash *,.escena,.escena *,.revela,.revela *{animation-duration:.01s!important;animation-delay:0s!important}}

/* ============ BUSCADOR Y ORDEN ============ */
.busqueda{position:relative}
.busqueda svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.busqueda input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px 0 42px}
.busqueda input:focus{border-color:var(--accent);outline:none}
.orden{height:34px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;font-size:13px;font-weight:600;color:var(--ink)}
.rank-acc{display:flex;align-items:center;gap:12px}
.etq{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-right:6px}

/* ============ MAPA ============ */
.mapa{height:min(62vh,520px);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;background:var(--soft);z-index:0}
.mapa-chico{height:200px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:var(--soft);z-index:0}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:2px solid var(--surface);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pin b{transform:rotate(45deg);color:var(--accent-ink);font-family:var(--display);font-weight:400;font-size:14px}
.pin.baja{background:var(--off)}.pin.baja b{color:var(--off-ink)}
.pin.pendiente{background:var(--surface);border:2px dashed var(--accent)}.pin.pendiente b{color:var(--accent)}
.pin.yo{background:var(--accent)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.leaflet-popup-content{margin:12px 14px;font-family:var(--body);font-size:14px;line-height:1.4}
.pop b{font-size:15px}.pop small{color:var(--muted)}
a.btn{color:var(--ink)}
.vistas button{font-size:14px;line-height:1.15}
.pop .acc{display:flex;gap:6px;margin-top:8px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-control-attribution{font-size:10px}
.mapa-oscuro .leaflet-gl-layer{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9) saturate(.6)}
.resultados{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.resultados button{text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:14px}
.resultados button:last-child{border-bottom:0}
.resultados button:hover{background:var(--soft)}
.resultados small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ubic-fila{display:flex;gap:8px}.ubic-fila input{flex:1;min-width:0}
.mapa-leyenda{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.mapa-leyenda label{display:flex;align-items:center;gap:6px}

/* ============ FOTOS DE PERFIL ============ */
.avatar{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;background:var(--soft);color:var(--accent);font-family:var(--display);border:1.5px solid var(--line)}
.mi-foto{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.jurado .avatar{margin-bottom:6px}

/* ============ FOTOS ============ */
.mini{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--soft)}
.fila-nom{display:flex;align-items:center;gap:10px;min-width:0}
.foto-grande{width:100%;max-height:300px;object-fit:cover;border-radius:12px;display:block;background:var(--soft)}
.foto-botones{display:flex;gap:8px;flex-wrap:wrap}
.foto-vacia{display:flex;align-items:center;justify-content:center;gap:8px;height:84px;border:1.5px dashed var(--off);border-radius:12px;color:var(--muted);font-weight:600;background:transparent;width:100%}
.foto-vacia svg{width:22px;height:22px}
</style>
</head>
<body>

      <h1>Veredicto</h1>
      <button class="grupo-btn" data-a="grupos" aria-label="Cambiar de grupo"><span id="nombreGrupo"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>

    <input type="search" id="buscar" placeholder="Buscar en todos los veredictos" aria-label="Buscar veredictos" autocomplete="off">

<div id="velo" class="velo" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* =====================================================================
   1. CONEXIÓN CON SUPABASE
   La llave pública se puede mostrar: la seguridad la ponen las reglas (RLS).
   ===================================================================== */
const SUPABASE_URL = 'https://dcdtaelliihjheevcieb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vc3DRDsC-VuVe5Kxzrkf9A_8O7X5XEg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =====================================================================
   2. ESTADO: todo lo que la página "sabe" en este momento
   ===================================================================== */
const SUGERIDAS = ['Cafés','Cenas','Películas','Heladerías','Series','Brunch'];
// Aspectos que se proponen al crear algunas categorías (después se pueden cambiar)
const ASPECTOS_SUG = {
  'cafes':['Café','Comida','Ambiente','Precio'], 'cenas':['Comida','Ambiente','Atención','Precio'],
  'peliculas':['Historia','Actuación','Entretenida'], 'series':['Historia','Personajes','Final'],
  'heladerias':['Sabor','Variedad','Precio'], 'brunch':['Comida','Café','Ambiente','Precio'],
  'restaurantes':['Comida','Ambiente','Atención','Precio'], 'bares':['Tragos','Ambiente','Precio'],
  'hamburgueserias':['Hamburguesa','Papas','Precio'], 'pizzerias':['Pizza','Ambiente','Precio']
};
const S = {
  yo: null,          // mi id de usuario
  grupos: [],        // todos mis grupos: [{ id, nombre, codigo, creado_por }]
  todosMiembros: [], // los miembros de todos mis grupos
  grupoSel: null,    // id del grupo que estoy mirando
  miembros: [],      // miembros del grupo actual: [{ user_id, nombre }]
  cats: [],          // [{ id, nombre, aspectos:[] }]
  items: [],         // [{ id, categoria_id, nombre, lugar, link, notas, fecha, pendiente }]
  puntajes: [],      // [{ item_id, user_id, puntaje, aspectos:{} }]
  catSel: null,      // categoría que estás mirando
  vista: 'rank',
  busca: '',
  mapaTodas: true,   // el mapa muestra todas las categorías o solo la actual         // lo que escribiste en el buscador
  orden: 'nota',     // cómo se ordena el ranking: 'nota', 'fecha' o 'polemico'     // 'rank' (ranking), 'pend' (pendientes) o 'desac' (desacuerdos)
  confirma: null,    // qué está pidiendo confirmación
  votos: {},        // cuántos votaron cada veredicto: { itemId: 3 }
  fotos: {},
  avatares: {},      // dirección temporal de cada foto de perfil        // dirección temporal para ver cada foto: { 'grupo/foto.jpg': 'https://...' }
  listo: false
};

/* =====================================================================
   3. FUNCIONES DE AYUDA
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nota = n => n == null ? '–' : (Math.round(n * 10) / 10).toString().replace('.', ',');   // 8.5 -> "8,5"
const medio = n => Math.round(n * 2) / 2;                       // redondea a medio punto: 7.75 -> 8
const inicial = nombre => (nombre || '?').trim().charAt(0).toUpperCase();
const sinTildes = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function hoy(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nuevoId(){ return crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)}); }
function fechaLinda(f){ if(!f) return ''; return new Date(f+'T12:00').toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'}).replace('.', ''); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
async function seguro(fn, ok){
  try { await fn(); if (ok) toast(ok); return true; }
  catch(e){ console.error(e); toast(e?.message && /grupo|código|vos mismo/.test(e.message) ? e.message : 'No se pudo guardar. Revisá tu conexión y probá de nuevo.'); return false; }
}
const grupo = () => S.grupos.find(g => g.id === S.grupoSel);
const yo = () => S.miembros.find(m => m.user_id === S.yo) || {user_id:S.yo, nombre:'Vos'};
const otros = () => S.miembros.filter(m => m.user_id !== S.yo);
const jurado = () => [yo(), ...otros()];           // yo primero, después el resto
const soyCreador = () => grupo()?.creado_por === S.yo;
const catActual = () => S.cats.find(c => c.id === S.catSel);
function aspectosSugeridos(nombre){ return ASPECTOS_SUG[sinTildes(nombre).trim()] || []; }
function recordarGrupo(id){ try { localStorage.setItem('veredicto-grupo', id); } catch(e){} }
function grupoRecordado(){ try { return localStorage.getItem('veredicto-grupo'); } catch(e){ return null; } }

/* =====================================================================
   4. BASE DE DATOS: leer y guardar en Supabase
   ===================================================================== */
const db = {
  // Carga mis grupos, y todo lo del grupo elegido
  async cargar(){
    const [m, g] = await Promise.all([
      sb.from('miembros').select('espacio_id,user_id,nombre,unido,foto'),
      sb.from('espacios').select('id,nombre,codigo,creado_por,creado')
    ]);
    if (m.error) throw m.error; if (g.error) throw g.error;
    S.todosMiembros = m.data;
    S.grupos = g.data.filter(x => m.data.some(r => r.espacio_id === x.id && r.user_id === S.yo))
      .sort((a,b) => (a.creado||'').localeCompare(b.creado||''));
    if (!S.grupos.length){ S.listo = false; mostrar('bienvenida'); formGrupo($('#bForm'), 'crear', true); return; }
    if (!S.grupos.some(x => x.id === S.grupoSel)) S.grupoSel = S.grupos.some(x => x.id === grupoRecordado()) ? grupoRecordado() : S.grupos[0].id;
    recordarGrupo(S.grupoSel);
    const gid = S.grupoSel;
    const [c, i] = await Promise.all([
      sb.from('categorias').select('id,nombre,aspectos,creado').eq('espacio_id', gid).order('creado'),
      sb.from('items').select('id,categoria_id,nombre,lugar,link,notas,fecha,pendiente,foto,lat,lng,creado').eq('espacio_id', gid)
    ]);
    if (c.error) throw c.error; if (i.error) throw i.error;
    const ids = i.data.map(x => x.id);
    const p = ids.length ? await sb.from('puntajes').select('item_id,user_id,puntaje,aspectos').in('item_id', ids) : {data:[]};
    if (p.error) throw p.error;
    S.miembros = m.data.filter(r => r.espacio_id === gid).sort((a,b) => (a.unido||'').localeCompare(b.unido||''));
    S.cats = c.data.map(x => ({...x, aspectos: Array.isArray(x.aspectos) ? x.aspectos : []}));
    S.items = i.data;
    S.puntajes = p.data.map(x => ({...x, puntaje:Number(x.puntaje), aspectos:x.aspectos || {}}));
    // Cuántos votaron cada veredicto (las notas de los demás solo se ven si ya votaste)
    const v = await sb.rpc('votos_por_item', { e: gid });
    S.votos = v.error ? {} : Object.fromEntries((v.data || []).map(r => [r.item_id, Number(r.votos)]));
    if (!S.cats.some(x => x.id === S.catSel)) { S.catSel = S.cats[0]?.id || null; }
    await this.cargarFotos();
    await this.cargarAvatares();
    S.listo = true;
    mostrar('app');
  },
  // Las fotos son privadas: pedimos una dirección temporal (válida por un día) para poder verlas
  async cargarFotos(){
    const faltan = S.items.map(x => x.foto).filter(f => f && !S.fotos[f]);
    if (!faltan.length) return;
    const { data, error } = await sb.storage.from('fotos').createSignedUrls(faltan, 60 * 60 * 24);
    if (error){ console.error(error); return; }
    data.forEach(d => { if (d.signedUrl) S.fotos[d.path] = d.signedUrl; });
  },
  // Sube una foto (ya achicada) a la carpeta del grupo y devuelve dónde quedó
  async subirFoto(itemId, blob){
    const ruta = `${S.grupoSel}/${itemId}-${Date.now()}.jpg`;
    const { error } = await sb.storage.from('fotos').upload(ruta, blob, { contentType:'image/jpeg' });
    if (error) throw error;
    S.fotos[ruta] = URL.createObjectURL(blob);
    return ruta;
  },
  async borrarFoto(ruta){
    if (!ruta) return;
    const { error } = await sb.storage.from('fotos').remove([ruta]);
    if (error) console.error(error);   // si falla, no frenamos: la foto vieja queda sin usar
    delete S.fotos[ruta];
  },
  async crearCat(nombre){
    nombre = nombre.trim().replace(/\s+/g,' '); if (!nombre) return;
    const ya = S.cats.find(c => c.nombre.toLowerCase() === nombre.toLowerCase());
    if (ya){ S.catSel = ya.id; S.vista = 'rank'; render(); return; }
    const fila = { id:nuevoId(), espacio_id:S.grupoSel, nombre, aspectos:aspectosSugeridos(nombre) };
    const { error } = await sb.from('categorias').insert(fila); if (error) throw error;
    S.cats.push({...fila, creado:new Date().toISOString()}); S.catSel = fila.id; S.vista = 'rank'; render();
  },
  async editarCat(id, cambios){
    const { error } = await sb.from('categorias').update(cambios).eq('id', id); if (error) throw error;
    Object.assign(S.cats.find(c => c.id === id), cambios); render();
  },
  async borrarCat(id){
    const { error } = await sb.from('categorias').delete().eq('id', id); if (error) throw error;   // sus ítems se borran solos
    const ids = S.items.filter(x => x.categoria_id === id).map(x => x.id);
    S.items = S.items.filter(x => x.categoria_id !== id);
    S.puntajes = S.puntajes.filter(p => !ids.includes(p.item_id));
    S.cats = S.cats.filter(c => c.id !== id); S.catSel = S.cats[0]?.id || null; render();
  },
  async guardarItem(fila, miNota){
    const { error } = await sb.from('items').upsert({...fila, espacio_id:S.grupoSel}); if (error) throw error;
    const i = S.items.findIndex(x => x.id === fila.id);
    if (i >= 0) S.items[i] = {...S.items[i], ...fila}; else S.items.push({...fila, creado:new Date().toISOString()});
    if (miNota !== undefined){ await this.guardarNota(fila.id, miNota); await this.refrescarNotas(fila.id, miNota); }
    render();
  },
  // miNota: null (sin nota) o { puntaje, aspectos }
  async guardarNota(itemId, miNota){
    const antes = S.puntajes.find(p => p.item_id === itemId && p.user_id === S.yo);
    if (miNota == null){
      if (!antes) return;
      const { error } = await sb.from('puntajes').delete().eq('item_id', itemId).eq('user_id', S.yo); if (error) throw error;
      S.puntajes = S.puntajes.filter(p => p !== antes); return;
    }
    const fila = { item_id:itemId, user_id:S.yo, puntaje:miNota.puntaje, aspectos:miNota.aspectos || {}, actualizado:new Date().toISOString() };
    const { error } = await sb.from('puntajes').upsert(fila); if (error) throw error;
    if (antes) Object.assign(antes, fila); else S.puntajes.push(fila);
  },
  // Después de votar, pedimos de nuevo las notas: ahora la base de datos te deja ver las de los demás
  async refrescarNotas(itemId, miNota){
    const { data, error } = await sb.from('puntajes').select('item_id,user_id,puntaje,aspectos').eq('item_id', itemId);
    if (error) throw error;
    S.puntajes = S.puntajes.filter(p => p.item_id !== itemId).concat(data.map(x => ({...x, puntaje:Number(x.puntaje), aspectos:x.aspectos || {}})));
    if (miNota) S.votos[itemId] = data.length;
  },
  async borrarItem(id){
    const foto = S.items.find(x => x.id === id)?.foto;
    const { error } = await sb.from('items').delete().eq('id', id); if (error) throw error;
    S.items = S.items.filter(x => x.id !== id); S.puntajes = S.puntajes.filter(p => p.item_id !== id); render();
    await this.borrarFoto(foto);
  },
  async cargarAvatares(){
    const faltan = [...new Set(S.todosMiembros.map(m => m.foto).filter(f => f && !S.avatares[f]))];
    if (!faltan.length) return;
    const { data, error } = await sb.storage.from('avatares').createSignedUrls(faltan, 60 * 60 * 24);
    if (error){ console.error(error); return; }
    data.forEach(d => { if (d.signedUrl) S.avatares[d.path] = d.signedUrl; });
  },
  // Mi foto de perfil: se sube a mi carpeta y se anota en todos mis grupos
  async cambiarAvatar(blob){
    const vieja = S.todosMiembros.find(m => m.user_id === S.yo)?.foto || null;
    let ruta = null;
    if (blob){
      ruta = `${S.yo}/perfil-${Date.now()}.jpg`;
      const up = await sb.storage.from('avatares').upload(ruta, blob, { contentType:'image/jpeg' });
      if (up.error) throw up.error;
      S.avatares[ruta] = URL.createObjectURL(blob);
    }
    const { error } = await sb.from('miembros').update({ foto: ruta }).eq('user_id', S.yo); if (error) throw error;
    S.todosMiembros.concat(S.miembros).forEach(m => { if (m.user_id === S.yo) m.foto = ruta; });
    if (vieja){ await sb.storage.from('avatares').remove([vieja]); delete S.avatares[vieja]; }
    render();
  },
  async cambiarMiNombre(nombre){
    const { error } = await sb.from('miembros').update({nombre}).eq('espacio_id', S.grupoSel).eq('user_id', S.yo); if (error) throw error;
    yo().nombre = nombre; render();
  },
  async rpc(nombre, args){
    const { data, error } = await sb.rpc(nombre, args); if (error) throw error; return data;
  }
};

/* =====================================================================
   5. CÁLCULOS: notas, ranking, coincidencia y polémicos
   ===================================================================== */
// Las notas de cada miembro para un ítem, y el promedio del grupo
function notasDe(itemId){
  const notas = jurado().map(m => {
    const p = S.puntajes.find(x => x.item_id === itemId && x.user_id === m.user_id);
    return { ...m, puntaje: p ? p.puntaje : null, aspectos: p ? p.aspectos : {} };
  });
  const hay = notas.filter(n => n.puntaje != null).map(n => n.puntaje);
  const prom = hay.length ? hay.reduce((a,b)=>a+b,0) / hay.length : null;
  const rango = hay.length >= 2 ? Math.max(...hay) - Math.min(...hay) : 0;   // qué tan repartidas están las notas
  const mia = notas[0].puntaje;
  const oculto = mia == null && S.miembros.length > 1;          // no votaste: no ves las notas de los demás
  const coinc = hay.length >= 2 ? Math.round(100 - rango / 9 * 100) : null;   // 100% = todos pusieron lo mismo
  return { notas, prom, votos: hay.length, votosTotales: S.votos[itemId] ?? hay.length, rango, mia, oculto, coinc };
}
function ranking(catId){
  const porNota = (a,b) => (b.prom ?? -1) - (a.prom ?? -1) || (b.fecha||'').localeCompare(a.fecha||'') || a.nombre.localeCompare(b.nombre,'es');
  const lista = S.items.filter(x => x.categoria_id === catId && !x.pendiente).map(x => ({...x, ...notasDe(x.id)})).sort(porNota);
  lista.forEach((x, i) => x.puesto = x.prom != null ? i + 1 : null);   // el puesto siempre es por nota, aunque se ordene distinto
  if (S.orden === 'fecha') lista.sort((a,b) => (b.fecha||'').localeCompare(a.fecha||'') || porNota(a,b));
  if (S.orden === 'polemico') lista.sort((a,b) => (b.oculto ? -1 : b.rango) - (a.oculto ? -1 : a.rango) || porNota(a,b));
  return lista;
}
const pendientes = catId => S.items.filter(x => x.categoria_id === catId && x.pendiente).sort((a,b) => (b.creado||'').localeCompare(a.creado||''));
// Ítems puntuados por al menos dos personas (para comparar)
function fraseCoinc(c){ return c >= 90 ? 'Coinciden casi en todo' : c >= 75 ? 'Coinciden bastante' : c >= 55 ? 'Opiniones divididas' : 'No coinciden para nada'; }
function comparables(){ return S.items.filter(x => !x.pendiente).map(x => ({...x, ...notasDe(x.id)})).filter(x => x.votos >= 2); }
// En pareja: qué tanto coinciden (100% = notas idénticas)
function coincidencia(){
  const cs = comparables(); if (!cs.length) return null;
  const dif = cs.reduce((s,x) => s + x.rango, 0) / cs.length;
  return Math.round(100 - dif / 9 * 100);
}
// En grupo: el promedio de notas que pone cada uno (para el más exigente y el más generoso)
function jueces(){
  return jurado().map(m => {
    const ps = S.puntajes.filter(p => p.user_id === m.user_id && S.items.some(i => i.id === p.item_id && !i.pendiente));
    return { ...m, cant: ps.length, prom: ps.length ? ps.reduce((s,p)=>s+p.puntaje,0) / ps.length : null };
  }).filter(j => j.cant >= 3);
}

const CANDADO = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
// La foto de perfil de alguien, o un círculo con su inicial si no tiene
function avatar(m, tam = 36){
  const url = m?.foto && S.avatares[m.foto];
  const est = `width:${tam}px;height:${tam}px;font-size:${Math.round(tam * 0.42)}px`;
  return url ? `<img class="avatar" src="${esc(url)}" alt="" style="${est}">` : `<span class="avatar" style="${est}" aria-hidden="true">${esc(inicial(m?.nombre))}</span>`;
}
function tarjetaOculta(quien){ return `<span class="tarjeta oculta" aria-label="${esc(quien)}: nota oculta hasta que votes">${CANDADO}<small>${esc(inicial(quien))}</small></span>`; }
function tarjeta(n, quien){
  if (n == null) return `<span class="tarjeta falta" aria-label="${esc(quien)}: sin nota"><b>?</b><small>${esc(inicial(quien))}</small></span>`;
  return `<span class="tarjeta${n < 5 ? ' baja' : ''}" aria-label="${esc(quien)}: ${nota(n)}"><b class="num">${nota(n)}</b><small>${esc(inicial(quien))}</small></span>`;

function notasFila(x){
  if (S.miembros.length <= 4) return `<span class="tarjetas">${x.notas.map((n, i) => x.oculto && i > 0 ? tarjetaOculta(n.nombre) : tarjeta(n.puntaje, n.nombre)).join('')}</span>`;
  return `<span class="promedio${x.prom == null ? ' falta' : ''}" aria-label="Promedio ${nota(x.prom)}"><b class="num">${x.prom == null ? '?' : nota(Math.round(x.prom * 10) / 10)}</b></span>`;
}
function miniatura(x){ return x.foto && S.fotos[x.foto] ? `<img class="mini" src="${esc(S.fotos[x.foto])}" alt="" loading="lazy">` : ''; }
function subFila(x){
  if (x.oculto) return {t: x.votosTotales ? `Votá para ver las notas · ${x.votosTotales} ${x.votosTotales === 1 ? 'ya votó' : 'ya votaron'}` : 'Todavía nadie votó', choque:false, oculto:true};
  if (S.miembros.length === 2 && x.votos === 2 && x.rango >= 3) return {t:`No coinciden: ${x.notas.map(n => nota(n.puntaje)).join(' contra ')}`, choque:true};
  if (S.miembros.length > 2 && x.votos >= 2 && x.rango >= 4) return {t:`Polémico: de ${nota(Math.min(...x.notas.filter(n=>n.puntaje!=null).map(n=>n.puntaje)))} a ${nota(Math.max(...x.notas.filter(n=>n.puntaje!=null).map(n=>n.puntaje)))}`, choque:true};
  const partes = [x.lugar, fechaLinda(x.fecha)];
  if (S.miembros.length > 4) partes.push(`${x.votos} de ${S.miembros.length} votaron`);
  return {t: partes.filter(Boolean).join(' · '), choque:false};
}

/* ---------- MAPA ---------- */
let mapa = null, mapaChico = null;
// Fondo del mapa: OpenFreeMap (gratis y sin llave). En modo oscuro se oscurece con un filtro.
function esOscuro(){ return document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); }
function capaMapa(contenedor){
  contenedor.classList.toggle('mapa-oscuro', esOscuro());
  // "Positron": un mapa simple y claro, para que se destaquen tus lugares
  const capa = L.maplibreGL({ style: 'https://tiles.openfreemap.org/styles/positron',
    attribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' });
  capa.on('add', () => { const gl = capa.getMaplibreMap && capa.getMaplibreMap(); if (gl) gl.on('styledata', () => simplificarMapa(gl)); });
  return capa;
}
// Escondemos lo que no aporta: paradas de colectivo, negocios, edificios en 3D, números de casa, íconos y carteles de rutas.
// Quedan las calles con sus nombres, los barrios, las plazas y el agua.
const SOBRA_FUENTE = ['poi', 'building', 'housenumber', 'aeroway', 'aerodrome_label', 'mountain_peak'];
const SOBRA_NOMBRE = /poi|housenumber|shield|transit|bus[-_ ]?stop/i;
function simplificarMapa(gl){
  let capas; try { capas = gl.getStyle()?.layers || []; } catch(e){ return; }
  capas.forEach(l => {
    const sobra = SOBRA_FUENTE.includes(l['source-layer']) || SOBRA_NOMBRE.test(l.id) || l.type === 'fill-extrusion' || (l.type === 'symbol' && l.layout && l.layout['icon-image']);
    if (sobra && gl.getLayoutProperty(l.id, 'visibility') !== 'none') gl.setLayoutProperty(l.id, 'visibility', 'none');
  });
}
// Dónde centrar la búsqueda y el mapa: el promedio de los lugares del grupo, o Buenos Aires
function centroGrupo(){
  const ls = S.items.filter(x => x.lat != null);
  if (!ls.length) return { lat: -34.6037, lng: -58.3816 };
  return { lat: ls.reduce((s,x) => s + x.lat, 0) / ls.length, lng: ls.reduce((s,x) => s + x.lng, 0) / ls.length };
}
const conUbicacion = () => S.items.filter(x => x.lat != null && x.lng != null && (S.mapaTodas || x.categoria_id === S.catSel));
function iconoPin(x){
  const n = x.pendiente ? null : notasDe(x.id);
  const txt = x.pendiente ? '·' : n.oculto ? '?' : n.prom != null ? nota(Math.round(n.prom)) : '–';
  const clase = x.pendiente ? 'pendiente' : (n.prom != null && n.prom < 5 && !n.oculto ? 'baja' : '');
  return L.divIcon({ className:'', html:`<div class="pin ${clase}"><b class="num">${txt}</b></div>`, iconSize:[34,34], iconAnchor:[17,34], popupAnchor:[0,-30] });
}
const comoLlegar = x => `https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lng}`;
function dibujarMapa(){
  if (!window.L || !L.maplibreGL){ $('#mapa').innerHTML = '<p class="vacio" style="padding:20px">No se pudo cargar el mapa. Revisá tu conexión.</p>'; return; }
  mapa = L.map('mapa', { zoomControl: true });
  capaMapa($('#mapa')).addTo(mapa);
  const lugares = conUbicacion(), marcas = [];
  lugares.forEach(x => {
    const n = x.pendiente ? null : notasDe(x.id);
    const cat = S.cats.find(c => c.id === x.categoria_id)?.nombre || '';
    const detalle = x.pendiente ? 'Pendiente' : n.oculto ? 'Votá para ver las notas' : n.prom != null ? `Promedio ${nota(Math.round(n.prom*10)/10)} · ${n.votos} ${n.votos===1?'nota':'notas'}` : 'Sin notas todavía';
    const mk = L.marker([x.lat, x.lng], { icon: iconoPin(x), title: x.nombre }).addTo(mapa)
      .bindPopup(`<div class="pop"><b>${esc(x.nombre)}</b><br><small>${esc(cat)}${x.lugar ? ' · ' + esc(x.lugar) : ''}</small><br>${esc(detalle)}
        <div class="acc"><button class="btn chico" data-a="abrir" data-id="${x.id}">Ver</button><a class="btn chico" href="${comoLlegar(x)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none">Cómo llegar</a></div></div>`);
    marcas.push(mk);
  });
  if (marcas.length) mapa.fitBounds(L.featureGroup(marcas).getBounds().pad(0.25), { maxZoom: 15 });
  else { const c = centroGrupo(); mapa.setView([c.lat, c.lng], 12); }   // si todavía no hay lugares
}
function quitarMapa(){ if (mapa){ mapa.remove(); mapa = null; } }

// Buscar un lugar por nombre o dirección (Photon: libre, tolera errores de tipeo y prioriza lo cercano)
// La zona donde se busca: alrededor de los lugares del grupo (o de Buenos Aires), unos 70 km a la redonda
function zonaBusqueda(){ const c = centroGrupo(), d = 0.65, r = v => Math.round(v * 1e4) / 1e4;
  return { lat: r(c.lat), lng: r(c.lng), oeste: r(c.lng - d), sur: r(c.lat - d), este: r(c.lng + d), norte: r(c.lat + d) }; }
const enZona = (p, z) => p.lat >= z.sur && p.lat <= z.norte && p.lng >= z.oeste && p.lng <= z.este;
const distancia = (a, b) => Math.hypot(a.lat - b.lat, (a.lng - b.lng) * Math.cos(a.lat * Math.PI / 180));
async function buscarLugar(q, todoElMundo){
  const z = zonaBusqueda();
  let url = `https://photon.komoot.io/api/?limit=8&lat=${z.lat}&lon=${z.lng}&q=` + encodeURIComponent(q);
  if (!todoElMundo) url += `&bbox=${z.oeste},${z.sur},${z.este},${z.norte}`;   // solo resultados dentro de la zona
  const r = await fetch(url);
  if (!r.ok) throw new Error('busqueda');
  const lista = (await r.json()).features.map(f => {
    const p = f.properties || {};
    const calle = p.street ? p.street + (p.housenumber ? ' ' + p.housenumber : '') : '';
    const partes = [calle, p.district || p.locality, p.city, p.state, p.country].filter((t, i, a) => t && a.indexOf(t) === i);
    return { lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0], nombre: p.name || calle || partes[0] || 'Lugar', direccion: partes.join(', '), barrio: p.district || p.locality || p.city || '' };
  });
  if (todoElMundo) return lista;
  return lista.filter(x => enZona(x, z)).sort((a, b) => distancia(a, z) - distancia(b, z));   // solo la zona, lo más cercano primero
}
// DIRECCIONES DE ARGENTINA: Georef, el servicio gratuito del Estado que entiende "calle altura" y "calle esquina calle"
// Primero limpiamos lo que se copia de Google Maps: código postal, "Cdad. Autónoma de Buenos Aires", "Argentina"...
function limpiarDireccion(q){
  return q.split(',')[0]
    .replace(/\b[A-Z]\d{4}[A-Z]{0,3}\b/gi, '')
    .replace(/\b(cdad\.?|ciudad)\s+aut[oó]noma\s+de\s+buenos\s+aires\b|\bcaba\b|\bcapital\s+federal\b|\bargentina\b/gi, '')
    .replace(/\s+/g, ' ').trim();
}
// Espera una respuesta como máximo unos segundos (si un servicio anda lento, seguimos con los otros)
async function traerJSON(url, segundos = 8){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), segundos * 1000);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error('http ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
// Plan B si el navegador no deja leer la respuesta directamente: pedirla "como script" (JSONP)
function traerJSONP(url, segundos = 8){
  return new Promise((ok, mal) => {
    const nombre = 'usig_' + Math.random().toString(36).slice(2), sc = document.createElement('script');
    const fin = () => { delete window[nombre]; sc.remove(); clearTimeout(t); };
    const t = setTimeout(() => { fin(); mal(new Error('jsonp')); }, segundos * 1000);
    window[nombre] = datos => { fin(); ok(datos); };
    sc.onerror = () => { fin(); mal(new Error('jsonp')); };
    sc.src = url + '&callback=' + nombre;
    document.head.appendChild(sc);
  });
}
const lindo = t => String(t || '').toLowerCase().replace(/(^|[\s(.\-])([a-záéíóúñü])/g, (m, a, b) => a + b.toUpperCase()).replace(/ (Y|De|Del|La|Las|Los|E) /g, m => m.toLowerCase());
// ¿La zona de búsqueda está en Buenos Aires y alrededores? (ahí funciona el servicio de la Ciudad)
const enAMBA = z => z.lat > -35.4 && z.lat < -34.0 && z.lng > -59.4 && z.lng < -57.7;

// CIUDAD DE BUENOS AIRES y alrededores: el servicio oficial de la Ciudad (USIG), que conoce cada altura de cada calle
async function buscarUSIG(dir){
  const url = 'https://servicios.usig.buenosaires.gob.ar/normalizar/?geocodificar=TRUE&srid=4326&maxOptions=10&direccion=' + encodeURIComponent(dir);
  let datos;
  try { datos = await traerJSON(url); } catch(e){ datos = await traerJSONP(url); }
  return (datos?.direccionesNormalizadas || []).map(d => {
    const c = d.coordenadas || {}, lat = parseFloat(c.y ?? c.lat), lng = parseFloat(c.x ?? c.lng);
    if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    const esCaba = String(d.cod_partido || '').toLowerCase() === 'caba' || /^caba$/i.test(d.nombre_partido || '');
    const zona = esCaba ? 'Ciudad de Buenos Aires' : [lindo(d.nombre_localidad), lindo(d.nombre_partido)].filter((t, i, a) => t && a.indexOf(t) === i).join(', ');
    return { lat, lng, nombre: lindo(String(d.direccion || dir).split(',')[0]), direccion: zona, barrio: esCaba ? '' : lindo(d.nombre_partido) };
  }).filter(Boolean);
}
// RESTO DE ARGENTINA: Georef, el servicio gratuito del Estado nacional
async function buscarGeoref(dir){
  const datos = await traerJSON('https://apis.datos.gob.ar/georef/api/v2.0/direcciones?max=10&direccion=' + encodeURIComponent(dir));
  return (datos.direcciones || []).filter(d => d.ubicacion && d.ubicacion.lat != null).map(d => {
    const loc = d.localidad_censal?.nombre, prov = d.provincia?.nombre, dep = d.departamento?.nombre;
    return { lat: d.ubicacion.lat, lng: d.ubicacion.lon, nombre: d.nomenclatura?.split(',')[0] || dir,
      direccion: [loc, prov].filter((t, i, a) => t && a.indexOf(t) === i).join(', '),
      barrio: dep && !/^comuna/i.test(dep) ? dep : (loc && loc !== prov ? loc : '') };
  });
}
async function buscarDireccion(q){
  const limpia = limpiarDireccion(q), esq = separarEsquina(limpia);
  if (!/\d/.test(limpia) && !esq) return [];   // sin altura ni esquina no es una dirección
  const z = zonaBusqueda();
  // Preguntamos a los dos servicios a la vez y juntamos lo que respondan
  const pedidos = [buscarGeoref(esq ? `${esq[0]} esquina ${esq[1]}` : limpia)];
  if (enAMBA(z)) pedidos.unshift(buscarUSIG(esq ? `${esq[0]} y ${esq[1]}` : limpia));
  const respuestas = await Promise.allSettled(pedidos);
  const todas = [];
  respuestas.forEach(r => { if (r.status === 'fulfilled') r.value.forEach(p => {
    if (!todas.some(x => distancia(x, p) < 0.0015)) todas.push(p);   // la misma dirección repetida (≈150 m) aparece una sola vez
  }); else console.error(r.reason); });
  if (!todas.length && respuestas.every(r => r.status === 'rejected')) throw new Error('direcciones');
  todas.sort((a, b) => distancia(a, z) - distancia(b, z));
  const cerca = todas.filter(x => enZona(x, z));
  return cerca.length ? cerca : todas;   // si en tu zona no hay, mostramos las de otras partes del país
}

// ESQUINAS: "Libertad y Quintana\" → busca dónde se cruzan esas dos calles (con Overpass, de OpenStreetMap)
function separarEsquina(q){
  const m = q.match(/^(.+?)\s+(?:y|e|esquina|esq\.?|&|\/)\s+(.+)$/i);
  return m ? [m[1].trim(), m[2].trim()] : null;
}
// Arma un patrón que encuentra la calle con o sin tildes y con o sin "Av.", sin confundir "Libertad" con "Libertador"
function patronCalle(nombre){
  const limpio = nombre.replace(/^(av\.?|avda\.?|avenida|calle|pje\.?|pasaje)\s+/i, '').trim();
  const grupos = { a:'[aáàä]', e:'[eéèë]', i:'[iíìï]', o:'[oóòö]', u:'[uúùü]', n:'[nñ]' };
  const cuerpo = sinTildes(limpio).replace(/[.*+?^${}()|[\]\\"]/g, '').split('').map(ch => grupos[ch] || ch).join('');
  return `(^| )${cuerpo}($| |,)`;
}
async function buscarEsquina(c1, c2, todoElMundo){
  const z = zonaBusqueda();   // las esquinas se buscan siempre en la zona (en todo el mundo serían demasiadas)
  const caja = `(${z.sur},${z.oeste},${z.norte},${z.este})`;
  const consulta = `[out:json][timeout:20];
    way["highway"]["name"~"${patronCalle(c1)}",i]${caja}->.a; node(w.a)->.na;
    way["highway"]["name"~"${patronCalle(c2)}",i]${caja}->.b; node(w.b)->.nb;
    node.na.nb; out 20;`;
  const r = await fetch('https://overpass-api.de/api/interpreter', { method:'POST', body:'data=' + encodeURIComponent(consulta),
    headers:{ 'Content-Type':'application/x-www-form-urlencoded' } });
  if (!r.ok) throw new Error('esquina');
  const nodos = (await r.json()).elements || [];
  // Puede haber varias esquinas con esos nombres (en distintas localidades): las agrupamos y ordenamos por cercanía
  const res = [];
  nodos.forEach(n => { if (!res.some(x => distancia(x, {lat:n.lat, lng:n.lon}) < 0.004)) res.push({ lat:n.lat, lng:n.lon }); });
  return res.sort((a, b) => distancia(a, z) - distancia(b, z)).slice(0, 5)
    .map((p, i) => ({ ...p, nombre: `Esquina de ${c1} y ${c2}`, direccion: i === 0 ? 'La más cercana a tus lugares' : `Otra esquina con esos nombres (a ${Math.round(distancia(p, z) * 111)} km)`, barrio: '' }));
}
// Si pegás un link de Google Maps (o unas coordenadas), sacamos la ubicación de ahí
function coordenadasDe(t){
  const pruebas = [/@(-?\d+\.\d+),(-?\d+\.\d+)/, /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/, /^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/];
  for (const re of pruebas){ const m = t.match(re); if (m){ const lat = Number(m[1]), lng = Number(m[2]); if (Math.abs(lat) <= 90 && Math.abs(lng) <= 180) return { lat, lng }; } }
  return null;
}
// La zona de "Ubicación" dentro de la ventana de un veredicto

async function ejecutarBusquedaUbic(){
  const q = $('#fUbic').value.trim(); if (!q) return;
  H.ubicTexto = q;
  const res = $('#resUbic');
  // ¿Pegaste un link de Google Maps o unas coordenadas?
  const c = coordenadasDe(q);
  if (c){ H.lat = c.lat; H.lng = c.lng; H.aMano = false; dibujarUbicacion(); return; }
  if (/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(q)){ res.innerHTML = '<p class="vacio" style="font-size:14px">Los links cortos de Google Maps no traen la ubicación. Buscalo por nombre, o marcalo a mano en el mapa.</p>'; return; }
  res.innerHTML = '<p class="vacio" style="font-size:14px">Buscando…</p>';
  H.mundo = $('#fMundo').checked;
  try {
    // Si escribiste una esquina ("Libertad y Quintana"), primero buscamos el cruce de las dos calles
    // 1) Direcciones y esquinas de Argentina (Georef)  2) esquinas con OpenStreetMap  3) nombres de lugares (Photon)
    const limpia = limpiarDireccion(q), esq = separarEsquina(limpia);
    let lista = [];
    if (!H.mundo){ try { lista = await buscarDireccion(q); } catch(e){ console.error(e); } }
    if (!lista.length && esq){ try { lista = await buscarEsquina(esq[0], esq[1], H.mundo); } catch(e){ console.error(e); } }
    if (!lista.length) lista = await buscarLugar(H.mundo ? q : limpia, H.mundo);
    if (!lista.length){ res.innerHTML = `<p class="vacio" style="font-size:14px">No encontramos ese lugar${H.mundo ? '' : ' cerca'}. Probá con la dirección y el número${H.mundo ? '' : ', marcá "Buscar en todo el mundo"'} o marcalo a mano en el mapa.</p>`; return; }
    H.resultados = lista;
    res.innerHTML = `<div class="resultados">${lista.map((r, i) => `<button type="button" data-a="elegirUbic" data-i="${i}"><b>${esc(r.nombre)}</b><small>${esc(r.direccion)}</small></button>`).join('')}</div>`;
  } catch(e){ res.innerHTML = '<p class="vacio" style="font-size:14px">No se pudo buscar. Revisá tu conexión y probá de nuevo.</p>'; }
}

// Achica la foto antes de subirla: como mucho 1280 píxeles de lado, en JPEG
// Foto de perfil: recorte cuadrado del centro, de 400 x 400 píxeles
async function recortarCuadrada(archivo){
  const img = await createImageBitmap(archivo, { imageOrientation:'from-image' });
  const lado = Math.min(img.width, img.height), T = 400;
  const c = document.createElement('canvas'); c.width = c.height = T;
  c.getContext('2d').drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, T, T);
  return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
}
async function achicar(archivo){
  const img = await createImageBitmap(archivo, { imageOrientation:'from-image' });
  const k = Math.min(1, 1280 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
}

// Con aspectos: un − y + por aspecto, y la nota general es el promedio. Sin aspectos: una sola nota.
// 5 estrellas: cada media estrella es 1 punto (una nota de 7 son 3 estrellas y media)
const PUNTA = 'M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2 6.1 20.4l1.3-6.5L2.5 9.3l6.6-.8z';
function estrellas(n, chicas){
  let h = '';
  for (let i = 0; i < 5; i++){
    const lleno = Math.max(0, Math.min(1, n / 2 - i));   // 0 = vacía, 0.5 = media, 1 = llena
    h += `<span class="est"><svg viewBox="0 0 24 24"><path d="${PUNTA}" class="est-vacia"/></svg>
      <span class="est-llena" style="width:${lleno * 100}%"><svg viewBox="0 0 24 24"><path d="${PUNTA}"/></svg></span></span>`;
  }
  return `<span class="estrellas${chicas ? ' chicas' : ''}" role="img" aria-label="${n} de 10">${h}</span>`;
}
// Sin aspectos: estrellas con − y +, y la barra. Con aspectos: estrellas por aspecto, y la general es el promedio.
function controlesNota(){

function controlesEstrellas(){

  return `<div class="nota" style="padding-bottom:0"><span id="notaEst">${estrellas(notaGeneral())}</span></div>

// Debajo de las estrellas: volver a sumar los aspectos que sacaste, o agregar uno nuevo solo para este voto
function editorAspVoto(){
  const fuera = H.aspCat.filter(a => !H.aspectos.includes(a));
  return `<div class="asp-voto">
    ${fuera.length ? `<div class="asp-fuera"><span>No cuentan en este voto:</span>${fuera.map(a => `<button type="button" class="cat chica" data-a="volverAspVoto" data-n="${esc(a)}">+ ${esc(a)}</button>`).join('')}</div>` : ''}

function sumarAspVoto(){
  const i = $('#nuevoAspVoto'), nombre = (i?.value || '').trim().replace(/\s+/g, ' ');
  if (!nombre){ H.agregandoAsp = false; redibujarNota(); return; }
  const igual = [...H.aspCat, ...H.aspectos].find(a => sinTildes(a) === sinTildes(nombre));
  const n = igual || nombre;
  if (!H.aspectos.includes(n)){
    if (H.asp[n] == null) H.asp[n] = H.aspectos.length ? notaGeneral() : H.nota;
    H.aspectos.push(n);

  H.agregandoAsp = false; redibujarNota();
}
function notaGeneral(){ const vs = H.aspectos.map(a => H.asp[a]); return Math.round(vs.reduce((s,v)=>s+v,0) / vs.length); }
function conectarRango(){ const r = $('#fNota'); if (r) r.oninput = () => { H.nota = Number(r.value); $('#notaEst').innerHTML = estrellas(H.nota); }; }

async function guardarItem(form){
  const nombre = $('#fNombre').value.trim();
  if (!nombre){ const e=$('#eNombre'); e.textContent='Escribí el nombre del lugar o la película.'; e.hidden=false; $('#fNombre').focus(); return; }
  let link = $('#fLink').value.trim();
  if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
  const id = form.dataset.id || nuevoId();
  const previo = S.items.find(i => i.id === id);
  const fila = { id, categoria_id: previo ? previo.categoria_id : S.catSel, nombre, pendiente: H.pendiente,
    lugar: $('#fLugar').value.trim() || null, link: link || null, notas: $('#fNotas').value.trim() || null,
    fecha: H.pendiente ? null : ($('#fFecha').value || null), lat: H.lat, lng: H.lng };
  let miNota;   // undefined = no tocar la nota (pendientes)
  if (!H.pendiente){
    if ($('#fSinNota').checked) miNota = null;
    else if (H.aspectos.length) miNota = { puntaje: notaGeneral(), aspectos: Object.fromEntries(H.aspectos.map(a => [a, H.asp[a]])) };
    else miNota = { puntaje: H.nota, aspectos: {} };
  }
  const archivo = H.archivo, quitar = H.quitarFoto, fotoVieja = previo?.foto || null;
  // ¿Es la primera vez que votás algo que otros ya votaron? Entonces, después de guardar, se revelan sus notas
  const antes = previo && !previo.pendiente ? notasDe(id) : null;
  const votoNuevo = miNota && (!antes || antes.mia == null);
  const tocaRevelar = votoNuevo && antes && antes.oculto && antes.votosTotales > 0;
  fila.foto = fotoVieja;
  cerrarHoja();
  const eraPend = previo?.pendiente;
  const ok = await seguro(async () => {
    if (archivo){ toast('Subiendo la foto…'); fila.foto = await db.subirFoto(id, await achicar(archivo)); }
    else if (quitar) fila.foto = null;
    await db.guardarItem(fila, miNota);
    if (fotoVieja && fila.foto !== fotoVieja) await db.borrarFoto(fotoVieja);   // la foto anterior ya no se usa
  },
    H.pendiente ? (previo ? 'Pendiente guardado' : 'Agregado a pendientes') : (previo && !eraPend ? 'Veredicto actualizado' : 'Veredicto dictado'));
  if (ok && eraPend && !H.pendiente){ S.vista = 'rank'; render(); }
  if (ok && votoNuevo){
    const despues = notasDe(id);
    if (tocaRevelar && despues.notas.filter(o => o.puntaje != null).length >= 2) revelar(nombre, despues);
    else sellar(miNota.puntaje);
  }
}
