        ${soyCreador() && m.user_id !== S.yo ? `<button type="button" class="btn chico dan" data-a="pedirSacar" data-id="${m.user_id}">Sacar</button>` : ''}</div>
        <div id="zonaSacar-${m.user_id}"></div>`).join('')}</div></div>
    <div class="campo"><label>Apariencia</label><div class="tema" style="align-self:flex-start" role="group" aria-label="Apariencia"><button type="button" data-tema="auto">Auto</button><button type="button" data-tema="claro">Claro</button><button type="button" data-tema="oscuro">Oscuro</button></div></div>
    <div id="zonaSalir"></div>
    <div class="fin">
      <button type="button" class="btn dan" data-a="pedirSalirGrupo" style="margin-right:auto">Salir del grupo</button>
      <button type="button" class="btn" data-a="salir">Cerrar sesión</button>
      <button type="submit" class="btn pri">Guardar</button>
    </div></form>`;
  $('#velo').hidden = false;
  aplicarTema(temaGuardado);
  $('#fAvatar').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    toast('Subiendo tu foto…');
    const ok = await seguro(async () => db.cambiarAvatar(await recortarCuadrada(f)), 'Foto de perfil guardada');
    if (ok && !$('#velo').hidden) abrirAjustes();   // vuelve a dibujar los ajustes con la foto nueva
  };
}

function abrirNuevaCat(){
  $('#velo').innerHTML = `<form class="hoja" data-f="nuevaCat" role="dialog" aria-modal="true" aria-labelledby="cTit" novalidate>
    <h3 id="cTit">Nueva categoría</h3>
    <div class="campo"><label for="cNombre">Nombre</label><input type="text" id="cNombre" maxlength="40" placeholder="Ej: Hamburgueserías"></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">${SUGERIDAS.filter(s => !S.cats.some(c => c.nombre === s)).map(s => `<button type="button" class="cat" data-sug="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <div class="fin"><button type="button" class="btn" data-a="cerrar">Cancelar</button><button type="submit" class="btn pri">Crear</button></div></form>`;
  $('#velo').hidden = false;
  $('#velo').querySelectorAll('[data-sug]').forEach(b => b.onclick = () => { $('#cNombre').value = b.dataset.sug; });
  setTimeout(() => $('#cNombre').focus(), 60);
}

/* =====================================================================
   8. CLICS Y FORMULARIOS
   ===================================================================== */
document.addEventListener('click', async e => {
  if (e.target.id === 'velo'){ cerrarHoja(); return; }
  // Botones − y + de la nota (general o de un aspecto)
  const paso = e.target.closest('[data-paso]');
  if (paso){
    const d = Number(paso.dataset.paso), lim = v => Math.min(10, Math.max(1, v));
    if (paso.dataset.asp != null){ const a = H.aspectos[Number(paso.dataset.asp)]; H.asp[a] = lim(H.asp[a] + d); $('#asp' + paso.dataset.asp).innerHTML = estrellas(H.asp[a], true); $('#notaEst').innerHTML = estrellas(notaGeneral()); }
    else { H.nota = lim(H.nota + d); $('#fNota').value = H.nota; $('#notaEst').innerHTML = estrellas(H.nota); }
    return;
  }
  // "Ya fuimos" / "Queremos ir" dentro de la ventana
  const est = e.target.closest('[data-estado]');
  if (est){
    H.pendiente = est.dataset.estado === 'pend';
    document.querySelectorAll('[data-estado]').forEach(b => { b.classList.toggle('on', b === est); b.setAttribute('aria-checked', b === est); });
    $('#zonaNota').hidden = $('#zonaFecha').hidden = H.pendiente;
    $('#hGuardar').textContent = botonHoja(S.items.find(i => i.id === $('.hoja').dataset.id));
    return;
  }
  const sugAsp = e.target.closest('[data-sugasp]'); if (sugAsp){ sumarAspecto(sugAsp.dataset.sugasp); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if (a === 'cat'){ S.catSel = id; S.confirma = null; if (S.vista === 'desac') S.vista = 'rank'; render(); }
  else if (a === 'vista'){ S.vista = b.dataset.v; S.confirma = null; render(); }
  else if (a === 'desac'){ S.vista = 'desac'; render(); scrollTo(0,0); }
  else if (a === 'volverRank'){ S.vista = 'rank'; render(); }
  else if (a === 'nuevaCat'){ S.confirma = null; abrirNuevaCat(); }
  else if (a === 'sugerida') await seguro(() => db.crearCat(b.dataset.n));
  else if (a === 'editarCat'){ S.confirma = S.confirma === 'menuCat' ? null : 'menuCat'; render(); }
  else if (a === 'aspectos') abrirAspectos();
  else if (a === 'agregarAsp'){ sumarAspecto($('#nuevoAsp').value); $('#nuevoAsp').value = ''; $('#nuevoAsp').focus(); }
  else if (a === 'sacarAspVoto'){ const q = H.aspectos[Number(b.dataset.i)]; if (H.aspectos.length === 1) H.nota = H.asp[q]; H.aspectos = H.aspectos.filter(x => x !== q); redibujarNota(); }
  else if (a === 'volverAspVoto'){ const n = b.dataset.n; if (!H.aspectos.includes(n)){ if (!H.aspectos.length) H.asp[n] = H.nota; H.aspectos.push(n); H.aspectos = ordenAsp(H.aspectos); } redibujarNota(); }
  else if (a === 'abrirAspVoto'){ H.agregandoAsp = true; redibujarNota(); }
  else if (a === 'sumarAspVoto') sumarAspVoto();
  else if (a === 'quitarAsp'){ aspEdit.splice(Number(b.dataset.i), 1); dibujarAspectos(); }
  else if (a === 'pedirRenombrar'){ S.confirma = 'renombrar'; render(); const i=$('#inRenombrar'); i.focus(); i.select(); }
  else if (a === 'pedirBorrarCat'){ S.confirma = 'cat'; render(); }
  else if (a === 'borrarCat'){ const n = catActual().nombre; S.confirma = null; await seguro(() => db.borrarCat(S.catSel), 'Borraste ' + n); }
  else if (a === 'no'){ S.confirma = null; render(); }
  else if (a === 'nuevo') abrirHoja(null);
  else if (a === 'abrir') abrirHoja(id);
  else if (a === 'yaFuimos') abrirHoja(id, {yaFuimos:true});
  else if (a === 'cerrar') cerrarHoja();
  else if (a === 'buscarUbic') ejecutarBusquedaUbic();
  else if (a === 'elegirUbic'){ const r = H.resultados[Number(b.dataset.i)]; H.lat = r.lat; H.lng = r.lng; H.aMano = false;
    if (!$('#fLugar').value.trim() && r.barrio) $('#fLugar').value = r.barrio;
    dibujarUbicacion(); }
  else if (a === 'marcarMano'){ const c = centroGrupo(); H.lat = c.lat; H.lng = c.lng; H.aMano = true; dibujarUbicacion(); }
  else if (a === 'cambiarUbic' || a === 'quitarUbic'){ H.lat = null; H.lng = null; H.aMano = false; dibujarUbicacion(); if (a === 'cambiarUbic') setTimeout(() => $('#fUbic')?.focus(), 50); }
  else if (a === 'elegirFoto') $('#fFoto').click();
  else if (a === 'elegirAvatar') $('#fAvatar').click();
  else if (a === 'quitarAvatar'){ cerrarHoja(); await seguro(() => db.cambiarAvatar(null), 'Foto de perfil quitada'); }
  else if (a === 'quitarFoto'){ H.archivo = null; H.quitarFoto = true; $('#fFoto').value = ''; dibujarFoto(); }
  else if (a === 'pedirBorrarItem'){
    $('#zonaBorrar').innerHTML = `<div class="confirma"><span>¿Borrar esto y las notas de todo el grupo?</span>
      <button type="button" class="btn chico" data-a="noBorrarItem">No</button><button type="button" class="btn chico dan" data-a="borrarItem">Sí, borrar</button></div>`; }
  else if (a === 'noBorrarItem') $('#zonaBorrar').innerHTML = '';
  else if (a === 'borrarItem'){ const id2 = $('.hoja').dataset.id; cerrarHoja(); await seguro(() => db.borrarItem(id2), 'Borrado'); }
  // Grupos
  else if (a === 'grupos') abrirGrupos();
  else if (a === 'elegirGrupo'){ cerrarHoja(); if (id !== S.grupoSel){ S.grupoSel = id; S.catSel = null; S.vista = 'rank'; S.confirma = null; S.busca = ''; $('#buscar').value = ''; recordarGrupo(id); await seguro(() => db.cargar()); } }
  else if (a === 'formCrear' || a === 'formUnirse'){ $('#gBotones').hidden = true; formGrupo($('#gForm'), a === 'formCrear' ? 'crear' : 'unirse', false); setTimeout(() => { const n = $('#gMiNombre'); if (!n) return; (n.value ? ($('#gNombre') || $('#gCodigo')) : n).focus(); }, 60); }
  else if (a === 'modoGrupo'){ const nom = $('#gMiNombre').value; formGrupo($('#bForm'), b.dataset.modo, true); $('#gMiNombre').value = nom; }
  // Ajustes
  else if (a === 'ajustes') abrirAjustes();
  else if (a === 'copiar'){
    try { await navigator.clipboard.writeText(grupo().codigo); toast('Código copiado'); }
    catch(err){ toast('Código: ' + grupo().codigo); }
  }
  else if (a === 'pedirCodigo') $('#zonaCodigo').innerHTML = `<div class="confirma"><span>El código actual va a dejar de funcionar. Los que ya están en el grupo no se ven afectados.</span>
      <button type="button" class="btn chico" data-a="noCodigo">Cancelar</button><button type="button" class="btn chico pri" data-a="cambiarCodigo">Cambiar</button></div>`;
  else if (a === 'noCodigo') $('#zonaCodigo').innerHTML = '';
  else if (a === 'cambiarCodigo'){ await seguro(async () => { const c = await db.rpc('cambiar_codigo', {e:S.grupoSel}); grupo().codigo = c; $('#aCodigo').textContent = c; $('#zonaCodigo').innerHTML = ''; render(); }, 'Código cambiado'); }
  else if (a === 'pedirSacar'){ const m = S.miembros.find(x => x.user_id === id);
    $('#zonaSacar-' + id).innerHTML = `<div class="confirma" style="margin:6px 0"><span>¿Sacar a ${esc(m.nombre)}? También se borran sus notas en este grupo.</span>
      <button type="button" class="btn chico" data-a="noSacar" data-id="${id}">Cancelar</button><button type="button" class="btn chico dan" data-a="sacar" data-id="${id}">Sacar</button></div>`; }
  else if (a === 'noSacar') $('#zonaSacar-' + id).innerHTML = '';
  else if (a === 'sacar'){ const n = S.miembros.find(x => x.user_id === id).nombre; cerrarHoja(); await seguro(async () => { await db.rpc('sacar_miembro', {e:S.grupoSel, u:id}); await db.cargar(); }, `Sacaste a ${n} del grupo`); }
  else if (a === 'pedirSalirGrupo') $('#zonaSalir').innerHTML = `<div class="confirma"><span>¿Salir de "${esc(grupo().nombre)}"? Se borran tus notas en este grupo. Para volver, vas a necesitar el código.</span>
      <button type="button" class="btn chico" data-a="noSalirGrupo">Cancelar</button><button type="button" class="btn chico dan" data-a="salirGrupo">Salir</button></div>`;
  else if (a === 'noSalirGrupo') $('#zonaSalir').innerHTML = '';
  else if (a === 'salirGrupo'){ const n = grupo().nombre; cerrarHoja(); await seguro(async () => { await db.rpc('salir_del_grupo', {e:S.grupoSel}); S.grupoSel = null; await db.cargar(); }, `Saliste de ${n}`); }
  else if (a === 'salir'){ cerrarHoja(); sb.auth.signOut(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#velo').hidden) cerrarHoja();
  if (e.key === 'Enter' && e.target.id === 'nuevoAsp'){ e.preventDefault(); sumarAspecto(e.target.value); e.target.value = ''; }
});
document.addEventListener('submit', async e => {
  const f = e.target, t = f.dataset.f; if (!t) return;
  e.preventDefault();
  if (t === 'item') guardarItem(f);
  else if (t === 'nuevaCat'){ const v = $('#cNombre').value; if (!v.trim()) return; cerrarHoja(); await seguro(() => db.crearCat(v), 'Categoría creada'); }
  else if (t === 'renombrar'){ const v = $('#inRenombrar').value.trim().replace(/\s+/g,' '); if (!v) return; S.confirma = null; await seguro(() => db.editarCat(S.catSel, {nombre:v}), 'Nombre cambiado'); }
  else if (t === 'aspectos'){ const lista = [...new Set(aspEdit.map(a => a.trim()).filter(Boolean))]; cerrarHoja(); await seguro(() => db.editarCat(S.catSel, {aspectos:lista}), 'Aspectos guardados'); }
  else if (t === 'ajustes'){
    const ng = $('#aGrupo').value.trim(), nn = $('#aNombre').value.trim(); cerrarHoja();
    if (ng && ng !== grupo().nombre) await seguro(async () => { await db.rpc('renombrar_grupo', {e:S.grupoSel, nuevo_nombre:ng}); grupo().nombre = ng; render(); }, 'Grupo renombrado');
    if (nn && nn !== yo().nombre) await seguro(() => db.cambiarMiNombre(nn), 'Nombre guardado');
  }
  else if (t === 'grupo'){
    const modo = f.dataset.modo, nombre = $('#gMiNombre').value.trim();
    const err = x => { $('#gErr').textContent = x; $('#gErr').hidden = false; };
    if (!nombre) return err('Escribí tu nombre.');
    if (modo === 'unirse' && !$('#gCodigo').value.trim()) return err('Escribí el código que te pasaron.');
    $('#gListo').disabled = true;
    try {
      S.grupoSel = modo === 'crear'
        ? await db.rpc('crear_espacio', {mi_nombre:nombre, nombre_grupo:$('#gNombre').value.trim()})
        : await db.rpc('unirse_espacio', {cod:$('#gCodigo').value.trim(), mi_nombre:nombre});
      recordarGrupo(S.grupoSel); S.catSel = null; S.vista = 'rank';
      cerrarHoja(); await db.cargar();
      toast(modo === 'crear' ? 'Grupo creado' : '¡Te sumaste al grupo!');
    } catch(e2){ console.error(e2); err(e2.message || 'No se pudo. Probá de nuevo.'); }
    finally { const btn = $('#gListo'); if (btn) btn.disabled = false; }
  }
});
$('#buscar').addEventListener('input', e => { S.busca = e.target.value; S.confirma = null; render(); });
document.addEventListener('change', e => {
  if (e.target.id === 'orden'){ S.orden = e.target.value; render(); }
  if (e.target.id === 'mapaTodas'){ S.mapaTodas = e.target.checked; render(); }
});
// Enter en el campo de ubicación busca, en lugar de guardar el veredicto
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'nuevoAspVoto'){ e.preventDefault(); sumarAspVoto(); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'fUbic'){ e.preventDefault(); ejecutarBusquedaUbic(); } });
// Al volver a la app (por ejemplo, después de que alguien del grupo cargó algo), se actualiza sola
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.listo && $('#velo').hidden) db.cargar().catch(console.error); });

/* =====================================================================
   9. INICIAR SESIÓN Y CREAR CUENTA
   ===================================================================== */
const MENSAJES = {
  'Invalid login credentials': 'El email o la contraseña no coinciden.',
  'User already registered': 'Ya existe una cuenta con ese email. Tocá "Entrar con mi cuenta", acá abajo.',
  'Email not confirmed': 'Falta confirmar el email: revisá tu casilla y tocá el link que te llegó.'
};
let modoCrear = false;
function errLogin(t){ const e=$('#lErr'); e.textContent=t; e.hidden=false; }
function ponerModo(crear){
  modoCrear = crear;
  $('#lEntrar').textContent = crear ? 'Crear cuenta' : 'Entrar';
  $('#lPregunta').textContent = crear ? '¿Ya tenés cuenta?' : '¿No tenés cuenta?';
  $('#lCambiar').textContent = crear ? 'Entrar con mi cuenta' : 'Crear cuenta nueva';
  $('#lPass').placeholder = crear ? 'Mínimo 6 caracteres' : '';
  $('#lPass').autocomplete = crear ? 'new-password' : 'current-password';
  $('#lErr').hidden = true;
}
$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#lEmail').value.trim(), password = $('#lPass').value;
  $('#lErr').hidden = true;
  if (!email || !password) return errLogin('Completá el email y la contraseña.');
  if (modoCrear && password.length < 6) return errLogin('La contraseña tiene que tener al menos 6 caracteres.');
  $('#lEntrar').disabled = true;
  const { data, error } = modoCrear ? await sb.auth.signUp({email, password}) : await sb.auth.signInWithPassword({email, password});
  $('#lEntrar').disabled = false;
  if (error) return errLogin(MENSAJES[error.message] || error.message);
  if (modoCrear && !data.session) errLogin('Te mandamos un email para confirmar la cuenta. Tocá el link y después entrá acá.');
});
$('#lCambiar').onclick = () => ponerModo(!modoCrear);
$('#lVer').onclick = () => { const p=$('#lPass'); const ver=p.type==='password'; p.type=ver?'text':'password'; $('#lVer').textContent=ver?'Ocultar':'Mostrar'; };

/* Modo claro / oscuro: se aplica y se recuerda en este dispositivo */
function aplicarTema(t){
  if (t === 'claro') document.documentElement.dataset.theme = 'light';
  else if (t === 'oscuro') document.documentElement.dataset.theme = 'dark';
  else delete document.documentElement.dataset.theme;
  document.querySelectorAll('[data-tema]').forEach(b => b.classList.toggle('on', b.dataset.tema === t));
}
let temaGuardado = 'auto';
try { temaGuardado = localStorage.getItem('veredicto-tema') || 'auto'; } catch(e){}
aplicarTema(temaGuardado);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-tema]'); if (!b) return;
  temaGuardado = b.dataset.tema;
  try { localStorage.setItem('veredicto-tema', temaGuardado); } catch(e){}
  aplicarTema(temaGuardado);
  if (S.listo && S.vista === 'mapa') render();   // el mapa cambia a claro u oscuro
});

/* Al abrir: si hay sesión, cargar los datos; si no, mostrar el ingreso */
sb.auth.onAuthStateChange((_evento, sesion) => setTimeout(() => {
  if (!sesion){ Object.assign(S, {yo:null, grupos:[], todosMiembros:[], miembros:[], cats:[], items:[], puntajes:[], listo:false}); mostrar('login'); return; }
  if (S.yo === sesion.user.id && S.listo) return;
  S.yo = sesion.user.id;
  db.cargar().catch(e => { console.error(e); mostrar('app'); $('#main').innerHTML = '<div class="card"><p class="vacio">No se pudieron cargar los datos. Revisá tu conexión y recargá la página.</p></div>'; });
}, 0));
</script>
