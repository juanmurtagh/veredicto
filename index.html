<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Veredicto</title>
<meta name="theme-color" content="#F6F1E7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&display=swap">

<!-- Librería oficial de Supabase: le da a la página las funciones para hablar con la base de datos -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<style>
/* ============ COLORES Y TIPOGRAFÍAS ============
   Crema y rojo vino. Todos los colores están definidos acá una sola vez. */
:root{
  --bg:#F6F1E7; --surface:#FFFBF2; --soft:#EFE6D6; --ink:#2A1F1C; --muted:#75665D; --line:#E7DCC8;
  --accent:#8E1B2A; --accent-ink:#FFFBF2; --off:#DCCDB4; --off-ink:#5A4A40; --danger:#B3261E;
  --display:'Gloock',Georgia,'Times New Roman',serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
}
/* Modo oscuro automático (si el celular está en oscuro y no elegiste "Claro") */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161112; --surface:#201819; --soft:#2C2223; --ink:#F3E9DA; --muted:#A8978A; --line:#352A2A;
  --accent:#D4566A; --accent-ink:#1A0E10; --off:#3E3132; --off-ink:#C9B8A8; --danger:#F08A80;
  color-scheme:dark}}
/* Modo oscuro elegido a mano (mismos colores que arriba) */
:root[data-theme="dark"]{
  --bg:#161112; --surface:#201819; --soft:#2C2223; --ink:#F3E9DA; --muted:#A8978A; --line:#352A2A;
  --accent:#D4566A; --accent-ink:#1A0E10; --off:#3E3132; --off-ink:#C9B8A8; --danger:#F08A80;
  color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.vacio{text-align:center;color:var(--muted);margin:0;padding:8px 0}
.err{font-size:13px;color:var(--danger);margin:0}

/* ============ BOTONES Y CAMPOS ============ */
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dan{color:var(--danger)}
.btn.chico{height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=url],textarea{
  width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}

/* ============ PANTALLA DE INGRESO Y BIENVENIDA ============ */
.portada{max-width:400px;margin:9vh auto 0;display:flex;flex-direction:column;gap:14px}
.marca{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:8px}
.marca h1{font-size:48px;line-height:1}
.marca p{margin:0;color:var(--muted);max-width:30ch}
.sello{width:72px;height:72px}
.pass{position:relative}
.pass input{padding-right:84px}
.ver{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--accent);font-weight:600;font-size:13px}
.cambiar{text-align:center;margin:0;color:var(--muted);font-size:14px}
.portada .btn.pri{width:100%;height:48px}
.opciones{display:grid;gap:10px}
.opcion{text-align:left;display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.opcion.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opcion b{font-size:15px}
.opcion span{font-size:13px;color:var(--muted)}

/* ============ ENCABEZADO DE LA APP ============ */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px}
header.top h1{font-size:34px;line-height:1}
.ico{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.ico svg{width:20px;height:20px}
.invitar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--soft);border-radius:var(--r);padding:14px 16px}
.invitar p{margin:0;font-size:14px}
.codigo{font-family:var(--display);font-size:24px;letter-spacing:.12em}

/* ============ CATEGORÍAS (pestañas) ============ */
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--muted)}
.cat.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cat.mas{border-style:dashed}

/* ============ RANKING ============ */
.rank-cab{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rank-cab h2{font-size:28px}
.lista{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.item:hover{border-color:var(--muted)}
.pos{font-family:var(--display);font-size:22px;color:var(--muted);text-align:center}
.item.top1 .pos{color:var(--accent)}
.item .nom{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub.choque{color:var(--accent);font-weight:600}
.tarjetas{display:flex;gap:5px}
/* Cada tarjeta es el puntaje de una persona, como los jurados de la tele */
.tarjeta{width:40px;height:50px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  box-shadow:0 1px 0 rgba(0,0,0,.08)}
.tarjeta b{font-family:var(--display);font-weight:400;font-size:19px}
.tarjeta small{font-size:9px;font-weight:700;letter-spacing:.06em;margin-top:4px;opacity:.85}
.tarjeta.falta{background:transparent;color:var(--muted);border:1.5px dashed var(--off)}
.tarjeta.baja{background:var(--off);color:var(--off-ink)}

/* ============ VENTANA DE CARGA ============ */
.velo{position:fixed;inset:0;background:rgba(20,12,12,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.hoja{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
@media (min-width:600px){.velo{align-items:center}.hoja{border-radius:20px}}
.hoja h3{font-size:26px}
.fin{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* Selector de nota: la tarjeta grande con − y + */
.nota{display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 0}
.nota .tarjeta{width:84px;height:104px;border-radius:12px}
.nota .tarjeta b{font-size:44px}
.nota .tarjeta small{font-size:11px}
.paso{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:24px;line-height:1}
.rango{width:100%;accent-color:var(--accent)}
.sinnota{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.otro{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.otro .tarjeta{width:34px;height:42px}
.otro .tarjeta b{font-size:16px}
.confirma{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.confirma span{flex:1;min-width:150px}

/* ============ BOTÓN FIJO, AVISOS Y APARIENCIA ============ */
.pie{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center}
.pie .btn{width:100%;max-width:600px;height:54px;font-size:17px;border-radius:16px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:20;max-width:calc(100% - 32px)}
.tema{display:inline-flex;align-self:center;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.tema button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.tema button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
@media (prefers-reduced-motion:no-preference){.velo .hoja{animation:sube .2s ease-out}@keyframes sube{from{transform:translateY(24px);opacity:.6}}}

/* ============ GRUPOS ============ */
.grupo-btn{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:0;background:none;padding:0;color:var(--muted);font-weight:600;font-size:15px}
.grupo-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grupo-btn svg{width:16px;height:16px;flex:none}
.titulo{display:flex;flex-direction:column;gap:6px;min-width:0}
.grupos{display:flex;flex-direction:column;gap:8px}
.grupo{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.grupo.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.grupo b{font-size:15px}
.grupo span{font-size:13px;color:var(--muted)}
.miembro{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.miembro:last-child{border-bottom:0}
.etiqueta{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:6px}

/* ============ COINCIDENCIA Y POLÉMICOS ============ */
.afinidad{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);padding:14px 16px}
.afinidad b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.afinidad span{font-size:14px;opacity:.9}
.jurados{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.jurado{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px}
.jurado b{font-family:var(--display);font-weight:400;font-size:22px}
.jurado span{font-size:13px;color:var(--muted)}
.volver{align-self:flex-start;background:transparent;border:0;color:var(--accent);font-weight:600;padding:0}

/* ============ VISTAS, PENDIENTES Y ASPECTOS ============ */
.vistas{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.vistas button{flex:1;height:36px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted)}
.vistas button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.promedio{width:50px;height:50px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.promedio b{font-family:var(--display);font-weight:400;font-size:19px}
.promedio.falta{border-style:dashed;border-color:var(--off);color:var(--muted)}
.item .pend{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--off);justify-self:center}
.asp{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.asp:last-child{border-bottom:0}
.asp .ctrl{display:flex;align-items:center;gap:8px}
.asp .val{min-width:40px;text-align:center;font-family:var(--display);font-size:22px}
.paso.chico{width:36px;height:36px;font-size:20px}
.asp-otros{font-size:12px;color:var(--muted)}
.editor-asp{display:flex;gap:8px;align-items:center}
.editor-asp input{flex:1;min-width:0}
.quitar{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1;color:var(--muted);flex:none}
.notas-de{display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>

<!-- El sello de Veredicto: lo usamos en la portada -->
<template id="tplSello">
  <svg class="sello" viewBox="0 0 72 72" aria-hidden="true">
    <circle cx="36" cy="36" r="34" style="fill:var(--accent)"/>
    <circle cx="36" cy="36" r="28" fill="none" style="stroke:var(--accent-ink)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="36" y="47" text-anchor="middle" font-family="Gloock, Georgia, serif" font-size="32" style="fill:var(--accent-ink)">10</text>
  </svg>
</template>

<!-- ============ PANTALLA DE INGRESO ============ -->
<form id="login" class="portada" hidden novalidate>
  <div class="marca"><span class="lugar-sello"></span><h1>Veredicto</h1><p>Cafés, cenas y películas, puntuados en grupo.</p></div>
  <div class="campo"><label for="lEmail">Email</label><input type="email" id="lEmail" autocomplete="email" placeholder="tu@email.com"></div>
  <div class="campo"><label for="lPass">Contraseña</label>
    <div class="pass"><input type="password" id="lPass" autocomplete="current-password"><button type="button" class="ver" id="lVer">Mostrar</button></div>
  </div>
  <p class="err" id="lErr" hidden></p>
  <button type="submit" class="btn pri" id="lEntrar">Entrar</button>
  <p class="cambiar"><span id="lPregunta">¿No tenés cuenta?</span> <button type="button" class="link" id="lCambiar">Creá una</button></p>
  <div class="tema" role="group" aria-label="Apariencia"><button type="button" data-tema="auto">Auto</button><button type="button" data-tema="claro">Claro</button><button type="button" data-tema="oscuro">Oscuro</button></div>
</form>

<!-- ============ BIENVENIDA: tu primer grupo ============ -->
<div id="bienvenida" class="portada" hidden>
  <div class="marca"><span class="lugar-sello"></span><h1>Bienvenido</h1><p>Primero, armá tu primer grupo, o sumate al de alguien con su código.</p></div>
  <div id="bForm"></div>
  <p class="cambiar"><button type="button" class="link" data-a="salir">Cerrar sesión</button></p>
</div>

<!-- ============ LA APLICACIÓN ============ -->
<div id="app" class="wrap" hidden>
  <header class="top">
    <div class="titulo">
      <h1>Veredicto</h1>
      <button class="grupo-btn" data-a="grupos" aria-label="Cambiar de grupo"><span id="nombreGrupo"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <button class="ico" data-a="ajustes" aria-label="Ajustes del grupo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <main id="main" class="wrap" style="width:100%"></main>
</div>

<div class="pie" id="pie" hidden><button class="btn pri" data-a="nuevo" id="btnPie">Dictar veredicto</button></div>
<div id="velo" class="velo" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* =====================================================================
   1. CONEXIÓN CON SUPABASE
   La llave pública se puede mostrar: la seguridad la ponen las reglas (RLS).
   ===================================================================== */
const SUPABASE_URL = 'https://dcdtaelliihjheevcieb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vc3DRDsC-VuVe5Kxzrkf9A_8O7X5XEg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =====================================================================
   2. ESTADO: todo lo que la página "sabe" en este momento
   ===================================================================== */
const SUGERIDAS = ['Cafés','Cenas','Películas','Heladerías','Series','Brunch'];
// Aspectos que se proponen al crear algunas categorías (después se pueden cambiar)
const ASPECTOS_SUG = {
  'cafes':['Café','Comida','Ambiente','Precio'], 'cenas':['Comida','Ambiente','Atención','Precio'],
  'peliculas':['Historia','Actuación','Entretenida'], 'series':['Historia','Personajes','Final'],
  'heladerias':['Sabor','Variedad','Precio'], 'brunch':['Comida','Café','Ambiente','Precio'],
  'restaurantes':['Comida','Ambiente','Atención','Precio'], 'bares':['Tragos','Ambiente','Precio'],
  'hamburgueserias':['Hamburguesa','Papas','Precio'], 'pizzerias':['Pizza','Ambiente','Precio']
};
const S = {
  yo: null,          // mi id de usuario
  grupos: [],        // todos mis grupos: [{ id, nombre, codigo, creado_por }]
  todosMiembros: [], // los miembros de todos mis grupos
  grupoSel: null,    // id del grupo que estoy mirando
  miembros: [],      // miembros del grupo actual: [{ user_id, nombre }]
  cats: [],          // [{ id, nombre, aspectos:[] }]
  items: [],         // [{ id, categoria_id, nombre, lugar, link, notas, fecha, pendiente }]
  puntajes: [],      // [{ item_id, user_id, puntaje, aspectos:{} }]
  catSel: null,      // categoría que estás mirando
  vista: 'rank',     // 'rank' (ranking), 'pend' (pendientes) o 'desac' (desacuerdos)
  confirma: null,    // qué está pidiendo confirmación
  listo: false
};

/* =====================================================================
   3. FUNCIONES DE AYUDA
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nota = n => n == null ? '–' : (Math.round(n * 10) / 10).toString().replace('.', ',');   // 8.5 -> "8,5"
const medio = n => Math.round(n * 2) / 2;                       // redondea a medio punto: 7.75 -> 8
const inicial = nombre => (nombre || '?').trim().charAt(0).toUpperCase();
const sinTildes = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function hoy(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nuevoId(){ return crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)}); }
function fechaLinda(f){ if(!f) return ''; return new Date(f+'T12:00').toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'}).replace('.', ''); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
async function seguro(fn, ok){
  try { await fn(); if (ok) toast(ok); return true; }
  catch(e){ console.error(e); toast(e?.message && /grupo|código|vos mismo/.test(e.message) ? e.message : 'No se pudo guardar. Revisá tu conexión y probá de nuevo.'); return false; }
}
const grupo = () => S.grupos.find(g => g.id === S.grupoSel);
const yo = () => S.miembros.find(m => m.user_id === S.yo) || {user_id:S.yo, nombre:'Vos'};
const otros = () => S.miembros.filter(m => m.user_id !== S.yo);

/* =====================================================================
   4. BASE DE DATOS: leer y guardar en Supabase
   ===================================================================== */
const db = {
  // Carga mis grupos, y todo lo del grupo elegido
  async cargar(){
    const [m, g] = await Promise.all([
      sb.from('miembros').select('espacio_id,user_id,nombre,unido'),
      sb.from('espacios').select('id,nombre,codigo,creado_por,creado')
    ]);
    if (m.error) throw m.error; if (g.error) throw g.error;
    S.todosMiembros = m.data;
    S.grupos = g.data.filter(x => m.data.some(r => r.espacio_id === x.id && r.user_id === S.yo))
      .sort((a,b) => (a.creado||'').localeCompare(b.creado||''));
    if (!S.grupos.length){ S.listo = false; mostrar('bienvenida'); formGrupo($('#bForm'), 'crear', true); return; }
    if (!S.grupos.some(x => x.id === S.grupoSel)) S.grupoSel = S.grupos.some(x => x.id === grupoRecordado()) ? grupoRecordado() : S.grupos[0].id;
    recordarGrupo(S.grupoSel);
    const gid = S.grupoSel;
    const [c, i] = await Promise.all([
      sb.from('categorias').select('id,nombre,aspectos,creado').eq('espacio_id', gid).order('creado'),
      sb.from('items').select('id,categoria_id,nombre,lugar,link,notas,fecha,pendiente,creado').eq('espacio_id', gid)
    ]);
    if (c.error) throw c.error; if (i.error) throw i.error;
    const ids = i.data.map(x => x.id);
    const p = ids.length ? await sb.from('puntajes').select('item_id,user_id,puntaje,aspectos').in('item_id', ids) : {data:[]};
    if (p.error) throw p.error;
    S.miembros = m.data.filter(r => r.espacio_id === gid).sort((a,b) => (a.unido||'').localeCompare(b.unido||''));
    S.cats = c.data.map(x => ({...x, aspectos: Array.isArray(x.aspectos) ? x.aspectos : []}));
    S.items = i.data;
    S.puntajes = p.data.map(x => ({...x, puntaje:Number(x.puntaje), aspectos:x.aspectos || {}}));
    if (!S.cats.some(x => x.id === S.catSel)) { S.catSel = S.cats[0]?.id || null; }
    S.listo = true;
    mostrar('app');
  },
  async crearCat(nombre){
    nombre = nombre.trim().replace(/\s+/g,' '); if (!nombre) return;
    const ya = S.cats.find(c => c.nombre.toLowerCase() === nombre.toLowerCase());
    if (ya){ S.catSel = ya.id; S.vista = 'rank'; render(); return; }
    const fila = { id:nuevoId(), espacio_id:S.grupoSel, nombre, aspectos:aspectosSugeridos(nombre) };
    const { error } = await sb.from('categorias').insert(fila); if (error) throw error;
    S.cats.push({...fila, creado:new Date().toISOString()}); S.catSel = fila.id; S.vista = 'rank'; render();
  },
  async editarCat(id, cambios){
    const { error } = await sb.from('categorias').update(cambios).eq('id', id); if (error) throw error;
    Object.assign(S.cats.find(c => c.id === id), cambios); render();
  },
  async borrarCat(id){
    const { error } = await sb.from('categorias').delete().eq('id', id); if (error) throw error;   // sus ítems se borran solos
    const ids = S.items.filter(x => x.categoria_id === id).map(x => x.id);
    S.items = S.items.filter(x => x.categoria_id !== id);
    S.puntajes = S.puntajes.filter(p => !ids.includes(p.item_id));
    S.cats = S.cats.filter(c => c.id !== id); S.catSel = S.cats[0]?.id || null; render();
  },
  async guardarItem(fila, miNota){
    const { error } = await sb.from('items').upsert({...fila, espacio_id:S.grupoSel}); if (error) throw error;
    const i = S.items.findIndex(x => x.id === fila.id);
    if (i >= 0) S.items[i] = {...S.items[i], ...fila}; else S.items.push({...fila, creado:new Date().toISOString()});
    if (miNota !== undefined) await this.guardarNota(fila.id, miNota);
    render();
  },
  // miNota: null (sin nota) o { puntaje, aspectos }
  async guardarNota(itemId, miNota){
    const antes = S.puntajes.find(p => p.item_id === itemId && p.user_id === S.yo);
    if (miNota == null){
      if (!antes) return;
      const { error } = await sb.from('puntajes').delete().eq('item_id', itemId).eq('user_id', S.yo); if (error) throw error;
      S.puntajes = S.puntajes.filter(p => p !== antes); return;
    }
    const fila = { item_id:itemId, user_id:S.yo, puntaje:miNota.puntaje, aspectos:miNota.aspectos || {}, actualizado:new Date().toISOString() };
    const { error } = await sb.from('puntajes').upsert(fila); if (error) throw error;
    if (antes) Object.assign(antes, fila); else S.puntajes.push(fila);
  },
  async borrarItem(id){
    const { error } = await sb.from('items').delete().eq('id', id); if (error) throw error;
    S.items = S.items.filter(x => x.id !== id); S.puntajes = S.puntajes.filter(p => p.item_id !== id); render();
  },
  async cambiarMiNombre(nombre){
    const { error } = await sb.from('miembros').update({nombre}).eq('espacio_id', S.grupoSel).eq('user_id', S.yo); if (error) throw error;
    yo().nombre = nombre; render();
  },
  async rpc(nombre, args){
    const { data, error } = await sb.rpc(nombre, args); if (error) throw error; return data;
  }
};

/* =====================================================================
   5. CÁLCULOS: notas, ranking, coincidencia y polémicos
   ===================================================================== */
// Las notas de cada miembro para un ítem, y el promedio del grupo
function notasDe(itemId){
  const notas = jurado().map(m => {
    const p = S.puntajes.find(x => x.item_id === itemId && x.user_id === m.user_id);
    return { ...m, puntaje: p ? p.puntaje : null, aspectos: p ? p.aspectos : {} };
  });
  const hay = notas.filter(n => n.puntaje != null).map(n => n.puntaje);
  const prom = hay.length ? hay.reduce((a,b)=>a+b,0) / hay.length : null;
  const rango = hay.length >= 2 ? Math.max(...hay) - Math.min(...hay) : 0;   // qué tan repartidas están las notas
  return { notas, prom, votos: hay.length, rango, mia: notas[0].puntaje };
}
function ranking(catId){
  return S.items.filter(x => x.categoria_id === catId && !x.pendiente).map(x => ({...x, ...notasDe(x.id)}))
    .sort((a,b) => (b.prom ?? -1) - (a.prom ?? -1) || (b.fecha||'').localeCompare(a.fecha||'') || a.nombre.localeCompare(b.nombre,'es'));
}
const pendientes = catId => S.items.filter(x => x.categoria_id === catId && x.pendiente).sort((a,b) => (b.creado||'').localeCompare(a.creado||''));
// Ítems puntuados por al menos dos personas (para comparar)
function comparables(){ return S.items.filter(x => !x.pendiente).map(x => ({...x, ...notasDe(x.id)})).filter(x => x.votos >= 2); }
// En pareja: qué tanto coinciden (100% = notas idénticas)
function coincidencia(){
  const cs = comparables(); if (!cs.length) return null;
  const dif = cs.reduce((s,x) => s + x.rango, 0) / cs.length;
  return Math.round(100 - dif / 9 * 100);
}
// En grupo: el promedio de notas que pone cada uno (para el más exigente y el más generoso)
function jueces(){
  return jurado().map(m => {
    const ps = S.puntajes.filter(p => p.user_id === m.user_id && S.items.some(i => i.id === p.item_id && !i.pendiente));
    return { ...m, cant: ps.length, prom: ps.length ? ps.reduce((s,p)=>s+p.puntaje,0) / ps.length : null };
  }).filter(j => j.cant >= 3);
}

/* =====================================================================
   6. DIBUJAR LA PÁGINA
   ===================================================================== */
function tarjeta(n, quien){
  if (n == null) return `<span class="tarjeta falta" aria-label="${esc(quien)}: sin nota"><b>?</b><small>${esc(inicial(quien))}</small></span>`;
  return `<span class="tarjeta${n < 5 ? ' baja' : ''}" aria-label="${esc(quien)}: ${nota(n)}"><b class="num">${nota(n)}</b><small>${esc(inicial(quien))}</small></span>`;
}
// En grupos de hasta 4 se ven las tarjetas de cada uno; en grupos más grandes, el promedio
function notasFila(x){
  if (S.miembros.length <= 4) return `<span class="tarjetas">${x.notas.map(n => tarjeta(n.puntaje, n.nombre)).join('')}</span>`;
  return `<span class="promedio${x.prom == null ? ' falta' : ''}" aria-label="Promedio ${nota(x.prom)}"><b class="num">${x.prom == null ? '?' : nota(Math.round(x.prom * 10) / 10)}</b></span>`;
}
function subFila(x){
  if (S.miembros.length === 2 && x.votos === 2 && x.rango >= 3) return {t:`No coinciden: ${x.notas.map(n => nota(n.puntaje)).join(' contra ')}`, choque:true};
  if (S.miembros.length > 2 && x.votos >= 2 && x.rango >= 4) return {t:`Polémico: de ${nota(Math.min(...x.notas.filter(n=>n.puntaje!=null).map(n=>n.puntaje)))} a ${nota(Math.max(...x.notas.filter(n=>n.puntaje!=null).map(n=>n.puntaje)))}`, choque:true};
  const partes = [x.lugar, fechaLinda(x.fecha)];
  if (S.miembros.length > 4) partes.push(`${x.votos} de ${S.miembros.length} votaron`);
  return {t: partes.filter(Boolean).join(' · '), choque:false};
}

// La pantalla de desacuerdos (en pareja) o del jurado (en grupo)
function vistaDesacuerdos(){
  const cs = comparables().sort((a,b) => b.rango - a.rango);
  const enPareja = S.miembros.length === 2;
  const umbral = enPareja ? 3 : 4;
  const fuertes = cs.filter(x => x.rango >= umbral).slice(0, 15);
  const nombreCat = id => S.cats.find(c => c.id === id)?.nombre || '';
  let html = `<button class="volver" data-a="volverRank">‹ Volver</button>`;
  if (enPareja){
    html += `<section class="card" style="text-align:center"><p class="eyebrow">Coincidencia</p><h2 style="font-size:56px">${coincidencia()}%</h2>
      <p style="margin:0;color:var(--muted)">Calculado sobre ${cs.length} ${cs.length===1?'veredicto puntuado':'veredictos puntuados'} por los dos.</p></section>`;
  } else {
    const js = jueces().sort((a,b) => a.prom - b.prom);
    if (js.length >= 2){
      const ex = js[0], ge = js[js.length - 1];
      html += `<div class="jurados"><div class="jurado"><span>El más exigente</span><b>${esc(ex.nombre)}</b><span>Pone ${nota(Math.round(ex.prom*10)/10)} en promedio</span></div>
        <div class="jurado"><span>El más generoso</span><b>${esc(ge.nombre)}</b><span>Pone ${nota(Math.round(ge.prom*10)/10)} en promedio</span></div></div>`;
    } else html += `<section class="card"><p class="vacio">Cuando cada uno haya puntuado al menos 3 veredictos, acá van a ver quién es el más exigente y quién el más generoso.</p></section>`;
  }
  html += `<h2>${enPareja ? 'Donde no coinciden' : 'Los más polémicos'}</h2>`;
  if (!fuertes.length) html += `<section class="card"><p class="vacio">${enPareja ? 'Por ahora coinciden en todo.' : 'Por ahora no hubo grandes polémicas.'}</p></section>`;
  else html += `<div class="lista">${fuertes.map(x => `<button class="item" data-a="abrir" data-id="${x.id}">
      <span class="pos num" style="font-size:16px">${nota(x.rango)}</span>
      <span style="min-width:0"><span class="nom" style="display:block">${esc(x.nombre)}</span><span class="sub" style="display:block">${esc(nombreCat(x.categoria_id))}</span></span>
      <span class="tarjetas">${x.notas.filter(n => n.puntaje != null).slice(0, 4).map(n => tarjeta(n.puntaje, n.nombre)).join('')}</span></button>`).join('')}</div>
    <p class="vacio" style="font-size:13px">El número de la izquierda es la diferencia entre la nota más alta y la más baja.</p>`;
  return html;
}

    <div class="campo"><label for="fLink">Link <span style="font-weight:400">(opcional)</span></label><input type="url" id="fLink" maxlength="300" value="${esc(x?.link)}" placeholder="Google Maps, reseña, tráiler…"></div>
    <div class="campo"><label for="fNotas">Comentarios <span style="font-weight:400">(opcional)</span></label><textarea id="fNotas" maxlength="500" placeholder="Ej: pedir el budín de limón">${esc(x?.notas)}</textarea></div>
    ${x && x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;font-size:14px">Abrir link ↗</a>` : ''}
    <div id="zonaBorrar"></div>
    <div class="fin">
      ${x ? '<button type="button" class="btn dan" data-a="pedirBorrarItem" style="margin-right:auto">Borrar</button>' : ''}
      <button type="button" class="btn" data-a="cerrar">Cancelar</button>
      <button type="submit" class="btn pri" id="hGuardar">${botonHoja(x)}</button>
    </div>
  </form>`;
  $('#velo').hidden = false;
  $('#fSinNota').onchange = e => { $('#notaControles').hidden = e.target.checked; };
  $('#fNombre').oninput = () => $('#eNombre').hidden = true;
  conectarRango();
  if (!x) setTimeout(() => $('#fNombre').focus(), 60);
}
function botonHoja(x){ return H.pendiente ? (x ? 'Guardar' : 'Agregar a pendientes') : (x && !x.pendiente ? 'Guardar' : 'Dictar veredicto'); }
// Con aspectos: un − y + por aspecto, y la nota general es el promedio. Sin aspectos: una sola nota.
function controlesNota(){
  if (!H.aspectos.length) return `<div class="nota">
      <button type="button" class="paso" data-paso="-0.5" aria-label="Bajar medio punto">−</button>
      <span class="tarjeta"><b class="num" id="notaNum">${nota(H.nota)}</b><small>${esc(inicial(yo().nombre))}</small></span>
      <button type="button" class="paso" data-paso="0.5" aria-label="Subir medio punto">+</button></div>
    <input type="range" class="rango" id="fNota" min="1" max="10" step="0.5" value="${H.nota}" aria-label="Tu nota del 1 al 10">`;
  return `<div class="nota" style="padding-bottom:0"><span class="tarjeta"><b class="num" id="notaNum">${nota(notaGeneral())}</b><small>${esc(inicial(yo().nombre))}</small></span></div>
    <p class="vacio" style="font-size:13px;padding:0 0 4px">Tu nota general es el promedio de los aspectos.</p>
    ${H.aspectos.map((a, i) => `<div class="asp"><span>${esc(a)}</span><span class="ctrl">
      <button type="button" class="paso chico" data-paso="-0.5" data-asp="${i}" aria-label="Bajar ${esc(a)}">−</button>
      <span class="val num" id="asp${i}">${nota(H.asp[a])}</span>
      <button type="button" class="paso chico" data-paso="0.5" data-asp="${i}" aria-label="Subir ${esc(a)}">+</button></span></div>`).join('')}`;
}
function notaGeneral(){ const vs = H.aspectos.map(a => H.asp[a]); return medio(vs.reduce((s,v)=>s+v,0) / vs.length); }
function conectarRango(){ const r = $('#fNota'); if (r) r.oninput = () => { H.nota = Number(r.value); $('#notaNum').textContent = nota(H.nota); }; }
function cerrarHoja(){ $('#velo').hidden = true; $('#velo').innerHTML = ''; }

async function guardarItem(form){
  const nombre = $('#fNombre').value.trim();
  if (!nombre){ const e=$('#eNombre'); e.textContent='Escribí el nombre del lugar o la película.'; e.hidden=false; $('#fNombre').focus(); return; }
  let link = $('#fLink').value.trim();
  if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
  const id = form.dataset.id || nuevoId();
  const previo = S.items.find(i => i.id === id);
  const fila = { id, categoria_id: previo ? previo.categoria_id : S.catSel, nombre, pendiente: H.pendiente,
    lugar: $('#fLugar').value.trim() || null, link: link || null, notas: $('#fNotas').value.trim() || null,
    fecha: H.pendiente ? null : ($('#fFecha').value || null) };
  let miNota;   // undefined = no tocar la nota (pendientes)
  if (!H.pendiente){
    if ($('#fSinNota').checked) miNota = null;
    else if (H.aspectos.length) miNota = { puntaje: notaGeneral(), aspectos: {...H.asp} };
    else miNota = { puntaje: H.nota, aspectos: {} };
  }
  cerrarHoja();
  const eraPend = previo?.pendiente;
  const ok = await seguro(() => db.guardarItem(fila, miNota),
    H.pendiente ? (previo ? 'Pendiente guardado' : 'Agregado a pendientes') : (previo && !eraPend ? 'Veredicto actualizado' : 'Veredicto dictado'));
  if (ok && eraPend && !H.pendiente){ S.vista = 'rank'; render(); }
}

    <div id="listaAsp" style="display:flex;flex-direction:column;gap:8px"></div>

    ${aspectosSugeridos(cat.nombre).length ? `<div style="display:flex;flex-wrap:wrap;gap:8px">${aspectosSugeridos(cat.nombre).map(a => `<button type="button" class="cat" data-sugasp="${esc(a)}">+ ${esc(a)}</button>`).join('')}</div>` : ''}

function dibujarAspectos(){
  $('#listaAsp').innerHTML = aspEdit.length ? aspEdit.map((a, i) => `<div class="editor-asp"><input type="text" data-iasp="${i}" value="${esc(a)}" maxlength="24" aria-label="Aspecto ${i+1}"><button type="button" class="quitar" data-a="quitarAsp" data-i="${i}" aria-label="Quitar ${esc(a)}">×</button></div>`).join('')
    : '<p class="vacio" style="font-size:14px">Sin aspectos: se pone una sola nota.</p>';
  $('#listaAsp').querySelectorAll('[data-iasp]').forEach(inp => inp.oninput = () => aspEdit[Number(inp.dataset.iasp)] = inp.value);
}
function sumarAspecto(v){
  v = (v || '').trim(); if (!v || aspEdit.some(a => a.toLowerCase() === v.toLowerCase())) return;
  aspEdit.push(v); dibujarAspectos();
}

/* =====================================================================
   8. CLICS Y FORMULARIOS
   ===================================================================== */
document.addEventListener('click', async e => {
  if (e.target.id === 'velo'){ cerrarHoja(); return; }
  // Botones − y + de la nota (general o de un aspecto)
  const paso = e.target.closest('[data-paso]');
  if (paso){
    const d = Number(paso.dataset.paso), lim = v => Math.min(10, Math.max(1, v));
    if (paso.dataset.asp != null){ const a = H.aspectos[Number(paso.dataset.asp)]; H.asp[a] = lim(H.asp[a] + d); $('#asp' + paso.dataset.asp).textContent = nota(H.asp[a]); $('#notaNum').textContent = nota(notaGeneral()); }
    else { H.nota = lim(H.nota + d); $('#fNota').value = H.nota; $('#notaNum').textContent = nota(H.nota); }
    return;
  }
  // "Ya fuimos" / "Queremos ir" dentro de la ventana
  const est = e.target.closest('[data-estado]');
  if (est){
    H.pendiente = est.dataset.estado === 'pend';
    document.querySelectorAll('[data-estado]').forEach(b => { b.classList.toggle('on', b === est); b.setAttribute('aria-checked', b === est); });
    $('#zonaNota').hidden = $('#zonaFecha').hidden = H.pendiente;
    $('#hGuardar').textContent = botonHoja(S.items.find(i => i.id === $('.hoja').dataset.id));
    return;
  }
  const sugAsp = e.target.closest('[data-sugasp]'); if (sugAsp){ sumarAspecto(sugAsp.dataset.sugasp); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if (a === 'cat'){ S.catSel = id; S.confirma = null; if (S.vista === 'desac') S.vista = 'rank'; render(); }
  else if (a === 'vista'){ S.vista = b.dataset.v; S.confirma = null; render(); }
  else if (a === 'desac'){ S.vista = 'desac'; render(); scrollTo(0,0); }
  else if (a === 'volverRank'){ S.vista = 'rank'; render(); }
  else if (a === 'nuevaCat'){ S.confirma = null; abrirNuevaCat(); }
  else if (a === 'sugerida') await seguro(() => db.crearCat(b.dataset.n));
  else if (a === 'editarCat'){ S.confirma = S.confirma === 'menuCat' ? null : 'menuCat'; render(); }
  else if (a === 'aspectos') abrirAspectos();
  else if (a === 'agregarAsp'){ sumarAspecto($('#nuevoAsp').value); $('#nuevoAsp').value = ''; $('#nuevoAsp').focus(); }
  else if (a === 'quitarAsp'){ aspEdit.splice(Number(b.dataset.i), 1); dibujarAspectos(); }
  else if (a === 'pedirRenombrar'){ S.confirma = 'renombrar'; render(); const i=$('#inRenombrar'); i.focus(); i.select(); }
  else if (a === 'pedirBorrarCat'){ S.confirma = 'cat'; render(); }
  else if (a === 'borrarCat'){ const n = catActual().nombre; S.confirma = null; await seguro(() => db.borrarCat(S.catSel), 'Borraste ' + n); }
  else if (a === 'no'){ S.confirma = null; render(); }
  else if (a === 'nuevo') abrirHoja(null);
  else if (a === 'abrir') abrirHoja(id);
  else if (a === 'yaFuimos') abrirHoja(id, {yaFuimos:true});
  else if (a === 'cerrar') cerrarHoja();
  else if (a === 'pedirBorrarItem'){
    $('#zonaBorrar').innerHTML = `<div class="confirma"><span>¿Borrar esto y las notas de todo el grupo?</span>
      <button type="button" class="btn chico" data-a="noBorrarItem">No</button><button type="button" class="btn chico dan" data-a="borrarItem">Sí, borrar</button></div>`; }
  else if (a === 'noBorrarItem') $('#zonaBorrar').innerHTML = '';
  else if (a === 'borrarItem'){ const id2 = $('.hoja').dataset.id; cerrarHoja(); await seguro(() => db.borrarItem(id2), 'Borrado'); }
  // Grupos
  else if (a === 'grupos') abrirGrupos();
  else if (a === 'elegirGrupo'){ cerrarHoja(); if (id !== S.grupoSel){ S.grupoSel = id; S.catSel = null; S.vista = 'rank'; S.confirma = null; recordarGrupo(id); await seguro(() => db.cargar()); } }
  else if (a === 'formCrear' || a === 'formUnirse'){ $('#gBotones').hidden = true; formGrupo($('#gForm'), a === 'formCrear' ? 'crear' : 'unirse', false); setTimeout(() => { const n = $('#gMiNombre'); if (!n) return; (n.value ? ($('#gNombre') || $('#gCodigo')) : n).focus(); }, 60); }
  else if (a === 'modoGrupo'){ const nom = $('#gMiNombre').value; formGrupo($('#bForm'), b.dataset.modo, true); $('#gMiNombre').value = nom; }
  // Ajustes
  else if (a === 'ajustes') abrirAjustes();
  else if (a === 'copiar'){
    try { await navigator.clipboard.writeText(grupo().codigo); toast('Código copiado'); }
    catch(err){ toast('Código: ' + grupo().codigo); }
  }
  else if (a === 'pedirCodigo') $('#zonaCodigo').innerHTML = `<div class="confirma"><span>El código actual va a dejar de funcionar. Los que ya están en el grupo no se ven afectados.</span>
      <button type="button" class="btn chico" data-a="noCodigo">Cancelar</button><button type="button" class="btn chico pri" data-a="cambiarCodigo">Cambiar</button></div>`;
  else if (a === 'noCodigo') $('#zonaCodigo').innerHTML = '';
  else if (a === 'cambiarCodigo'){ await seguro(async () => { const c = await db.rpc('cambiar_codigo', {e:S.grupoSel}); grupo().codigo = c; $('#aCodigo').textContent = c; $('#zonaCodigo').innerHTML = ''; render(); }, 'Código cambiado'); }
  else if (a === 'pedirSacar'){ const m = S.miembros.find(x => x.user_id === id);
    $('#zonaSacar-' + id).innerHTML = `<div class="confirma" style="margin:6px 0"><span>¿Sacar a ${esc(m.nombre)}? También se borran sus notas en este grupo.</span>
      <button type="button" class="btn chico" data-a="noSacar" data-id="${id}">Cancelar</button><button type="button" class="btn chico dan" data-a="sacar" data-id="${id}">Sacar</button></div>`; }
  else if (a === 'noSacar') $('#zonaSacar-' + id).innerHTML = '';
  else if (a === 'sacar'){ const n = S.miembros.find(x => x.user_id === id).nombre; cerrarHoja(); await seguro(async () => { await db.rpc('sacar_miembro', {e:S.grupoSel, u:id}); await db.cargar(); }, `Sacaste a ${n} del grupo`); }
  else if (a === 'pedirSalirGrupo') $('#zonaSalir').innerHTML = `<div class="confirma"><span>¿Salir de "${esc(grupo().nombre)}"? Se borran tus notas en este grupo. Para volver, vas a necesitar el código.</span>
      <button type="button" class="btn chico" data-a="noSalirGrupo">Cancelar</button><button type="button" class="btn chico dan" data-a="salirGrupo">Salir</button></div>`;
  else if (a === 'noSalirGrupo') $('#zonaSalir').innerHTML = '';
  else if (a === 'salirGrupo'){ const n = grupo().nombre; cerrarHoja(); await seguro(async () => { await db.rpc('salir_del_grupo', {e:S.grupoSel}); S.grupoSel = null; await db.cargar(); }, `Saliste de ${n}`); }
  else if (a === 'salir'){ cerrarHoja(); sb.auth.signOut(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#velo').hidden) cerrarHoja();
  if (e.key === 'Enter' && e.target.id === 'nuevoAsp'){ e.preventDefault(); sumarAspecto(e.target.value); e.target.value = ''; }
});
document.addEventListener('submit', async e => {
  const f = e.target, t = f.dataset.f; if (!t) return;
  e.preventDefault();
  if (t === 'item') guardarItem(f);
  else if (t === 'nuevaCat'){ const v = $('#cNombre').value; if (!v.trim()) return; cerrarHoja(); await seguro(() => db.crearCat(v), 'Categoría creada'); }
  else if (t === 'renombrar'){ const v = $('#inRenombrar').value.trim().replace(/\s+/g,' '); if (!v) return; S.confirma = null; await seguro(() => db.editarCat(S.catSel, {nombre:v}), 'Nombre cambiado'); }
  else if (t === 'aspectos'){ const lista = [...new Set(aspEdit.map(a => a.trim()).filter(Boolean))]; cerrarHoja(); await seguro(() => db.editarCat(S.catSel, {aspectos:lista}), 'Aspectos guardados'); }
  else if (t === 'ajustes'){
    const ng = $('#aGrupo').value.trim(), nn = $('#aNombre').value.trim(); cerrarHoja();
    if (ng && ng !== grupo().nombre) await seguro(async () => { await db.rpc('renombrar_grupo', {e:S.grupoSel, nuevo_nombre:ng}); grupo().nombre = ng; render(); }, 'Grupo renombrado');
    if (nn && nn !== yo().nombre) await seguro(() => db.cambiarMiNombre(nn), 'Nombre guardado');
  }
  else if (t === 'grupo'){
    const modo = f.dataset.modo, nombre = $('#gMiNombre').value.trim();
    const err = x => { $('#gErr').textContent = x; $('#gErr').hidden = false; };
    if (!nombre) return err('Escribí tu nombre.');
    if (modo === 'unirse' && !$('#gCodigo').value.trim()) return err('Escribí el código que te pasaron.');
    $('#gListo').disabled = true;
    try {
      S.grupoSel = modo === 'crear'
        ? await db.rpc('crear_espacio', {mi_nombre:nombre, nombre_grupo:$('#gNombre').value.trim()})
        : await db.rpc('unirse_espacio', {cod:$('#gCodigo').value.trim(), mi_nombre:nombre});
      recordarGrupo(S.grupoSel); S.catSel = null; S.vista = 'rank';
      cerrarHoja(); await db.cargar();
      toast(modo === 'crear' ? 'Grupo creado' : '¡Te sumaste al grupo!');
    } catch(e2){ console.error(e2); err(e2.message || 'No se pudo. Probá de nuevo.'); }
    finally { const btn = $('#gListo'); if (btn) btn.disabled = false; }
  }
});
// Al volver a la app (por ejemplo, después de que alguien del grupo cargó algo), se actualiza sola
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.listo && $('#velo').hidden) db.cargar().catch(console.error); });

/* =====================================================================
   9. INICIAR SESIÓN Y CREAR CUENTA
   ===================================================================== */
const MENSAJES = {
  'Invalid login credentials': 'El email o la contraseña no coinciden.',
  'User already registered': 'Ya existe una cuenta con ese email. Tocá "Entrá", acá abajo.',
  'Email not confirmed': 'Falta confirmar el email: revisá tu casilla y tocá el link que te llegó.'
};
let modoCrear = false;
function errLogin(t){ const e=$('#lErr'); e.textContent=t; e.hidden=false; }
function ponerModo(crear){
  modoCrear = crear;
  $('#lEntrar').textContent = crear ? 'Crear cuenta' : 'Entrar';
  $('#lPregunta').textContent = crear ? '¿Ya tenés cuenta?' : '¿No tenés cuenta?';
  $('#lCambiar').textContent = crear ? 'Entrá' : 'Creá una';
  $('#lPass').placeholder = crear ? 'Mínimo 6 caracteres' : '';
  $('#lPass').autocomplete = crear ? 'new-password' : 'current-password';
  $('#lErr').hidden = true;
}
$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#lEmail').value.trim(), password = $('#lPass').value;
  $('#lErr').hidden = true;
  if (!email || !password) return errLogin('Completá el email y la contraseña.');
  if (modoCrear && password.length < 6) return errLogin('La contraseña tiene que tener al menos 6 caracteres.');
  $('#lEntrar').disabled = true;
  const { data, error } = modoCrear ? await sb.auth.signUp({email, password}) : await sb.auth.signInWithPassword({email, password});
  $('#lEntrar').disabled = false;
  if (error) return errLogin(MENSAJES[error.message] || error.message);
  if (modoCrear && !data.session) errLogin('Te mandamos un email para confirmar la cuenta. Tocá el link y después entrá acá.');
});
$('#lCambiar').onclick = () => ponerModo(!modoCrear);
$('#lVer').onclick = () => { const p=$('#lPass'); const ver=p.type==='password'; p.type=ver?'text':'password'; $('#lVer').textContent=ver?'Ocultar':'Mostrar'; };

/* Modo claro / oscuro: se aplica y se recuerda en este dispositivo */
function aplicarTema(t){
  if (t === 'claro') document.documentElement.dataset.theme = 'light';
  else if (t === 'oscuro') document.documentElement.dataset.theme = 'dark';
  else delete document.documentElement.dataset.theme;
  document.querySelectorAll('[data-tema]').forEach(b => b.classList.toggle('on', b.dataset.tema === t));
}
let temaGuardado = 'auto';
try { temaGuardado = localStorage.getItem('veredicto-tema') || 'auto'; } catch(e){}
aplicarTema(temaGuardado);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-tema]'); if (!b) return;
  temaGuardado = b.dataset.tema;
  try { localStorage.setItem('veredicto-tema', temaGuardado); } catch(e){}
  aplicarTema(temaGuardado);
});

/* Al abrir: si hay sesión, cargar los datos; si no, mostrar el ingreso */
sb.auth.onAuthStateChange((_evento, sesion) => setTimeout(() => {
  if (!sesion){ Object.assign(S, {yo:null, grupos:[], todosMiembros:[], miembros:[], cats:[], items:[], puntajes:[], listo:false}); mostrar('login'); return; }
  if (S.yo === sesion.user.id && S.listo) return;
  S.yo = sesion.user.id;
  db.cargar().catch(e => { console.error(e); mostrar('app'); $('#main').innerHTML = '<div class="card"><p class="vacio">No se pudieron cargar los datos. Revisá tu conexión y recargá la página.</p></div>'; });
}, 0));
</script>
